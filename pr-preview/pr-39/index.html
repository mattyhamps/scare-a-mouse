<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scare-a-Mouse">
<meta name="theme-color" content="#4a3328">
<title>Scare-a-Mouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Almendra:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1d1a24; --bg2:#2a2533; --stone:#8d8478; --stone-d:#5d564d; --stone-l:#b3aa9c;
    --floor-a:#e9dfc9; --floor-b:#ddd1b6; --ink:#f6efe2; --muted:#b9ae9c;
    --gold:#f2b84b; --gold-d:#c98a1c; --red:#e0664f; --green:#7cc47a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:radial-gradient(120% 80% at 50% 0%,#3a3046 0%,var(--bg) 60%);color:var(--ink);
    font-family:Fredoka,ui-rounded,"SF Pro Rounded",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none}
  .app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;
    padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 14px)}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .hdr-right{display:flex;align-items:center;gap:8px}
  .soundbtn{font-size:18px;line-height:1;background:var(--bg2);border:2px solid #4a4155;border-radius:12px;padding:7px 9px;cursor:pointer}
  .soundbtn.off{opacity:.6}
  .brand,.lvlbtn{white-space:nowrap}
  @media (max-width:420px){ .brand{font-size:19px;gap:6px} .brand .crest{font-size:21px} .lvlbtn{padding:7px 10px} }
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:22px;letter-spacing:.3px}
  .preview-banner{background:var(--gold);color:#2b1d05;font-size:13px;font-weight:600;text-align:center;border-radius:10px;padding:6px 10px}
  .brand .crest{font-size:24px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
  .dots{display:flex;gap:6px}
  .dot{width:34px;height:34px;border-radius:10px;border:2px solid #4a4155;background:var(--bg2);color:var(--muted);font:600 15px Fredoka,system-ui;display:grid;place-items:center;cursor:pointer}
  .dot.cur{border-color:var(--gold);color:var(--ink)}
  .dot.done{background:#3c5a3b;border-color:#5f8f5d;color:#e6ffe4}
  .title{display:flex;align-items:baseline;justify-content:space-between}
  .title{gap:10px}
  .title h2{margin:0;font-size:20px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .title .sub{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .cheese{font:600 14px Fredoka,system-ui;color:#3a2f22;background:linear-gradient(180deg,#ffe7a8,#f2c95b);border-radius:999px;padding:2px 9px}
  .cheese.bump{animation:cheeseBump .6s ease-out}
  @keyframes cheeseBump{40%{transform:scale(1.35)}}
  .tip{background:var(--bg2);border:1px solid #3d3548;border-radius:14px;padding:10px 12px;font-size:15px;color:#e8dfcf;line-height:1.35;min-height:62px;box-sizing:border-box}
  .chain{display:flex;align-items:center;justify-content:center;gap:2px;font-size:20px;background:rgba(255,255,255,.04);border-radius:12px;padding:6px 4px}
  .chain .arrow{font-size:11px;color:var(--muted);margin:0 1px}
  .chain .cap{font-size:11px;color:var(--muted);margin-right:6px;font-weight:500}
  .board-wrap{position:relative;align-self:center}
  .board{position:relative;border-radius:14px;box-shadow:0 14px 30px rgba(0,0,0,.45),0 0 0 2px #3a332c}
  .lvlbtn{font:600 15px Fredoka,system-ui;color:var(--ink);background:var(--bg2);border:2px solid #4a4155;border-radius:12px;padding:7px 12px;cursor:pointer}
  .card.pick{max-width:400px;padding:18px 16px}
  .card.pick h3{margin:0 0 2px}
  .card.pick .danger{margin-top:10px;background:transparent;box-shadow:none;border:2px solid #6b3a35;color:#f0a99c;font-size:15px;padding:10px}
  .card.pick .danger.armed{background:#6b3a35;color:#fff}
  .card.pick p{margin:0 0 12px;font-size:14px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:14px;max-height:56vh;overflow:auto}
  .grid .dot{width:auto;aspect-ratio:1;height:auto}
  .grid .dot.locked{cursor:default;background:#17131c;border-color:#2e2836;color:#8d8398;font-size:12px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1}
  .grid .dot.locked .lk{font-size:13px;opacity:.85}
  .card.pick .danger.hidden{display:none}
  /* Castle map: the levels are a winding road through the castle's rooms. */
  .card.pick{padding:16px 12px}
  .map{position:relative;max-height:64vh;overflow:auto;margin:0 -2px 12px;border-radius:16px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;background:#1b1720}
  .room{position:relative;background:var(--rb)}
  .room:first-child{border-radius:16px 16px 0 0}
  .room-head{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:8px;padding:8px 12px;
    background:linear-gradient(180deg,var(--stone-l),var(--stone) 60%,var(--stone-d));color:#2a2420;
    box-shadow:0 3px 0 rgba(0,0,0,.25);text-align:left}
  .room-head .ic{font-size:22px}
  .room-head b{font:600 16px Fredoka,system-ui;flex:1}
  .room-head small{font-size:12px;font-weight:600;opacity:.75}
  .room-head .devtest{font:600 12px Fredoka,system-ui;color:#fff;background:#6b3a35;border:0;border-radius:8px;padding:4px 8px;cursor:pointer}
  .room-body{position:relative;overflow:hidden}
  .room-body svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  /* stone walls down both sides, with torches in indoor rooms */
  .room .wall-side{position:absolute;top:0;bottom:0;width:9px;z-index:1;
    background:repeating-linear-gradient(180deg,var(--stone) 0 18px,var(--stone-d) 18px 20px);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .room .wall-side.l{left:0} .room .wall-side.r{right:0}
  .room .torch{position:absolute;z-index:2;font-size:13px;transform:translate(-50%,-50%);animation:flicker 1.4s ease-in-out infinite;pointer-events:none}
  .room .torch::after{content:"";position:absolute;left:50%;top:50%;width:46px;height:46px;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,190,90,.28),transparent 65%);border-radius:50%}
  /* arched windows (room scenes use them on their walls) */
  .room .window{width:22px;height:30px;border-radius:11px 11px 2px 2px;background:linear-gradient(180deg,#9cc3e6,#5b7fa8);
    border:3px solid var(--stone-d);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);position:relative}
  .room .window::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--stone-d);transform:translateX(-50%)}
  .room.night .window{background:linear-gradient(180deg,#273257,#141a33)}
  .room .deco{position:absolute;font-size:17px;opacity:.85;pointer-events:none;transform:translate(-50%,-50%)}
  .node{position:absolute;z-index:2;width:40px;height:40px;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;
    display:grid;place-items:center;font:600 15px Fredoka,system-ui;color:#3a2f22;
    background:radial-gradient(circle at 50% 35%,#fff7e4,#e2d3b2);border:3px solid #a8946f;box-shadow:0 3px 0 rgba(0,0,0,.35)}
  .node.done{background:radial-gradient(circle at 50% 35%,#ffe7a3,#e9b34a);border-color:#b77d14;color:#3d2a05}
  .node.done::after{content:"✓";position:absolute;right:-5px;bottom:-5px;width:17px;height:17px;border-radius:50%;
    background:#5f8f5d;color:#fff;font-size:11px;display:grid;place-items:center;border:2px solid #2a2533}
  .node.cur{border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,184,75,.45),0 3px 0 rgba(0,0,0,.35)}
  .node.locked{cursor:default;background:#2b2531;border-color:#4a4155;color:#8d8398;font-size:11px;box-shadow:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:1px}
  .node.locked .lk{font-size:11px;opacity:.8}
  /* boss levels: bigger, with a crown and a red rim */
  .node.boss{width:50px;height:50px;font-size:17px;border-color:#b8323a;box-shadow:0 0 0 3px rgba(184,50,58,.35),0 3px 0 rgba(0,0,0,.35)}
  .node.boss::before{content:"👑";position:absolute;top:-13px;right:-10px;font-size:17px;transform:rotate(18deg);filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
  .node.boss.locked{border-color:#7a3a40}
  .tip.boss{border-color:#b8323a;background:rgba(184,50,58,.15)}
  .tip.hinting{border-color:var(--gold);background:rgba(242,184,75,.12);color:var(--ink)}
  /* your mouse, standing on the current level; it walks the road to a newly opened level */
  .walker{position:absolute;z-index:3;font-size:22px;transform:translate(-50%,-150%);pointer-events:none;
    transition:left .26s ease-in-out,top .26s ease-in-out}
  .walker span{display:block;animation:bob 1.2s ease-in-out infinite}
  .walker.walking span{animation:hop .26s ease-in-out infinite}
  /* fog over rooms you haven't reached */
  .room.fog .room-body > :not(.fog-cover){filter:blur(3px) brightness(.4) saturate(.5)}
  .fog-cover{position:absolute;inset:0;z-index:3;display:grid;place-items:center;align-content:center;gap:4px;color:#e9e0d2;
    font-size:14px;font-weight:600;text-shadow:0 2px 4px rgba(0,0,0,.6);
    background:linear-gradient(180deg,rgba(40,36,48,.35),rgba(30,27,36,.75))}
  .fog-cover .cloud{position:absolute;font-size:54px;opacity:.5;animation:drift 9s ease-in-out infinite alternate}
  .room.soon .room-body{height:120px}
  .room-body > :not(.fog-cover){transition:filter 1.2s ease}
  .fog-cover{transition:opacity 1.2s ease}
  .room.lifted .fog-cover{opacity:0;pointer-events:none}
  .walker.fade{opacity:0;transition:left .5s ease-in-out,top .5s ease-in-out,opacity .3s .4s}
  .node.next{animation:nextGlow 1.1s ease-in-out infinite}
  @keyframes nextGlow{0%,100%{box-shadow:0 0 0 3px rgba(242,184,75,.4),0 3px 0 rgba(0,0,0,.35)}50%{box-shadow:0 0 0 9px rgba(242,184,75,.15),0 0 18px rgba(242,184,75,.8)}}
  /* the door at the end of each room */
  .doorway{position:relative;height:74px;display:flex;align-items:center;justify-content:center;gap:12px;
    background:repeating-linear-gradient(90deg,var(--stone) 0 34px,var(--stone-d) 34px 36px),var(--stone);
    box-shadow:inset 0 3px 0 rgba(255,255,255,.18),inset 0 -4px 0 rgba(0,0,0,.3)}
  .doorway .arch{position:relative;width:50px;height:60px;margin-top:14px;border-radius:25px 25px 0 0;
    background:radial-gradient(circle at 50% 70%,#ffe9a8,#f2b84b 45%,#8a5a12);box-shadow:0 0 0 4px var(--stone-d);perspective:160px}
  .doorway .leaf{position:absolute;inset:0;border-radius:25px 25px 0 0;transform-origin:left center;transition:transform 1.1s cubic-bezier(.3,1.3,.5,1);
    background:repeating-linear-gradient(90deg,#8b5a2b 0 11px,#6f4520 11px 12px);box-shadow:inset 0 0 0 2px #4d2f15;
    display:grid;place-items:center;font-size:16px}
  .doorway.open .leaf{transform:rotateY(-78deg)}
  .doorway.open .leaf .lock{display:none}
  .doorway .label{font:600 13px Fredoka,system-ui;color:#2a2420;max-width:120px;text-align:left;line-height:1.2}
  .doorway .spark{position:absolute;font-size:18px;pointer-events:none;animation:spark 1.2s ease-out forwards}
  /* ---------- Room scenes ---------- */
  .room.scene .room-body{background:var(--floor-bg,#3a3340)}
  .scene.f-meadow  {--floor-bg:radial-gradient(circle at 20% 30%,rgba(255,255,255,.07) 0 2px,transparent 3px) 0 0/26px 26px,radial-gradient(circle at 70% 60%,rgba(0,0,0,.06) 0 3px,transparent 4px) 0 0/34px 34px,linear-gradient(180deg,#77a84f,#5f9140)}
  .scene.f-orchard {--floor-bg:radial-gradient(circle at 30% 40%,rgba(255,255,255,.06) 0 2px,transparent 3px) 0 0/24px 24px,radial-gradient(circle at 70% 70%,rgba(0,0,0,.07) 0 3px,transparent 4px) 0 0/30px 30px,linear-gradient(180deg,#6f9e48,#58873a)}
  .scene.f-yard    {--floor-bg:radial-gradient(circle at 30% 30%,rgba(255,255,255,.08) 0 2px,transparent 3px) 0 0/22px 22px,radial-gradient(circle at 60% 70%,rgba(80,50,20,.12) 0 4px,transparent 5px) 0 0/40px 40px,linear-gradient(180deg,#a89060,#8f7a4c)}
  .scene.f-bank    {--floor-bg:radial-gradient(circle at 30% 40%,rgba(255,255,255,.07) 0 2px,transparent 3px) 0 0/24px 24px,linear-gradient(90deg,rgba(60,120,160,.35),transparent 14%,transparent 86%,rgba(60,120,160,.35)),linear-gradient(180deg,#6f9e58,#5a8a48)}
  .scene.f-field   {--floor-bg:radial-gradient(circle at 30% 40%,rgba(255,255,255,.06) 0 2px,transparent 3px) 0 0/24px 24px,radial-gradient(circle at 70% 60%,rgba(0,0,0,.08) 0 3px,transparent 4px) 0 0/32px 32px,linear-gradient(180deg,#7a9a52,#66843f)}
  .scene.f-flags   {--floor-bg:linear-gradient(90deg,rgba(0,0,0,.18) 0 2px,transparent 2px) 0 0/58px 46px,linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px) 0 0/58px 46px,linear-gradient(180deg,#6a6058,#57504a)}
  .scene.f-cellar  {--floor-bg:linear-gradient(90deg,rgba(0,0,0,.2) 0 2px,transparent 2px) 0 0/50px 40px,linear-gradient(0deg,rgba(0,0,0,.2) 0 2px,transparent 2px) 0 0/50px 40px,radial-gradient(circle at 50% 30%,#5a4038,#3d2c28 70%)}
  .scene.f-dungeon {--floor-bg:linear-gradient(90deg,rgba(0,0,0,.28) 0 2px,transparent 2px) 0 0/44px 44px,linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px) 0 0/44px 44px,linear-gradient(180deg,#3e3c46,#2c2b33)}
  .scene.f-kitchen {--floor-bg:repeating-conic-gradient(#b88a5a 0 25%,#9e7346 0 50%) 0 0/40px 40px}
  .scene.f-hall    {--floor-bg:linear-gradient(90deg,rgba(0,0,0,.16) 0 2px,transparent 2px) 0 0/70px 54px,linear-gradient(0deg,rgba(0,0,0,.16) 0 2px,transparent 2px) 0 0/70px 54px,linear-gradient(180deg,#8a7058,#74604c)}
  .scene.f-marble  {--floor-bg:repeating-conic-gradient(#efe6ee 0 25%,#d6c8d6 0 50%) 0 0/48px 48px}
  .scene.f-parquet {--floor-bg:repeating-linear-gradient(45deg,#9a6a3e 0 14px,#86592f 14px 16px,#a8743f 16px 30px,#86592f 30px 32px),#9a6a3e}
  .scene.f-chapel  {--floor-bg:linear-gradient(90deg,rgba(0,0,0,.12) 0 2px,transparent 2px) 0 0/60px 60px,linear-gradient(0deg,rgba(0,0,0,.12) 0 2px,transparent 2px) 0 0/60px 60px,radial-gradient(circle at 50% 20%,rgba(180,160,255,.15),transparent 60%),linear-gradient(180deg,#b8b0a4,#a39b8f)}
  .scene.f-tunnel  {--floor-bg:radial-gradient(circle at 30% 40%,rgba(255,255,255,.05) 0 3px,transparent 4px) 0 0/30px 30px,radial-gradient(circle at 70% 70%,rgba(0,0,0,.18) 0 5px,transparent 6px) 0 0/44px 44px,linear-gradient(90deg,#2a2830,#3a3640 18%,#3a3640 82%,#2a2830)}
  .scene.f-wood    {--floor-bg:repeating-linear-gradient(90deg,#6b4a30 0 34px,#5d4029 34px 36px),#6b4a30}
  .scene.f-wood2   {--floor-bg:repeating-linear-gradient(90deg,#7a5434 0 30px,#6b482b 30px 32px),#7a5434}
  .scene.dark .room-body::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 40%,transparent 40%,rgba(0,0,0,.35))}
  .scene .wall-side{background:repeating-linear-gradient(180deg,#8d8478 0 18px,#6f675d 18px 20px)}
  .scene .deco{z-index:1}
  .bit{position:absolute;z-index:0;pointer-events:none;width:14px;height:10px}
  .bit.tuft{background:linear-gradient(60deg,transparent 45%,#4f8a35 45% 60%,transparent 60%),linear-gradient(-60deg,transparent 45%,#4f8a35 45% 60%,transparent 60%),linear-gradient(90deg,transparent 42%,#5e9a40 42% 58%,transparent 58%)}
  .bit.straw{background:linear-gradient(20deg,transparent 44%,#e3c46a 44% 56%,transparent 56%),linear-gradient(-30deg,transparent 44%,#d4b052 44% 56%,transparent 56%)}
  .bit.pebble{width:9px;height:6px;border-radius:50%;background:rgba(0,0,0,.18);box-shadow:8px 4px 0 -1px rgba(255,255,255,.06)}
  .bit.crumb{width:5px;height:5px;border-radius:50%;background:#e8cf98;box-shadow:6px 3px 0 -1px #d9b878,-4px 5px 0 -1px #e8cf98}
  .prop{position:absolute;z-index:1;width:120px;height:100px;transform:translate(-50%,-50%);pointer-events:none}
  .prop i,.scene-head i{position:absolute;display:block;font-style:normal}
  .prop .e,.scene-head .e{line-height:1}
  .prop .g-counter,.prop .g-shelf{position:absolute}
  .scene-head{position:absolute;left:0;right:0;top:0;height:190px;overflow:hidden;z-index:0}
  .scene-head::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30px;background:linear-gradient(180deg,transparent,var(--fade,rgba(0,0,0,.12)))}
  .sky{position:absolute;inset:0 0 40px;background:linear-gradient(180deg,#8fc3e8,#cfe6f2)}
  .sky.night{background:linear-gradient(180deg,#141a33,#3b4a78)}
  .sky .cloud{font-size:30px;opacity:.95;animation:cloud 22s linear infinite alternate}
  .h-hill{position:absolute;top:84px;height:120px;border-radius:50% 50% 0 0}
  .h-hedge{position:absolute;left:0;right:0;top:140px;height:24px;border-radius:12px;background:radial-gradient(circle at 10px 12px,#4f8a38 10px,transparent 11px) 0 0/20px 24px,#477f32}
  .h-trees{position:absolute;left:-10px;right:-10px;top:92px;display:flex;justify-content:space-between;font-size:40px;line-height:1}
  .h-barn{position:absolute;top:58px;width:30%;height:96px;background:repeating-linear-gradient(90deg,#a8323a 0 12px,#962a32 12px 14px);box-shadow:inset 0 0 0 3px #f2e6cc}
  .h-barn::before{content:"";position:absolute;left:-6px;right:-6px;top:-34px;height:36px;background:#5a3a1e;clip-path:polygon(50% 0,100% 100%,0 100%)}
  .h-barn::after{content:"";position:absolute;left:30%;right:30%;bottom:0;height:56%;background:linear-gradient(45deg,transparent 46%,#f2e6cc 46% 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,#f2e6cc 46% 54%,transparent 54%),#7a2028;box-shadow:inset 0 0 0 3px #f2e6cc}
  .h-fence{position:absolute;left:0;right:0;top:150px;height:20px;background:linear-gradient(180deg,transparent 3px,#9a6a3a 3px 8px,transparent 8px 12px,#9a6a3a 12px 17px,transparent 17px),repeating-linear-gradient(90deg,#7a5530 0 7px,transparent 7px 40px)}
  .h-castlewall{position:absolute;left:0;right:0;top:40px;height:92px;background:repeating-linear-gradient(0deg,#9a9083 0 20px,#857b70 20px 22px)}
  .h-castlewall::before{content:"";position:absolute;left:0;right:0;top:-14px;height:14px;background:repeating-linear-gradient(90deg,#9a9083 0 20px,transparent 20px 34px)}
  .h-castlewall.tall{top:46px;height:144px}
  .h-moat{position:absolute;left:0;right:0;top:132px;height:46px;background:repeating-linear-gradient(90deg,#5d9cc4 0 30px,#6aa8ce 30px 60px);animation:flow 4s linear infinite}
  .h-bridge{position:absolute;left:50%;top:124px;width:70px;height:66px;transform:translateX(-50%);background:repeating-linear-gradient(0deg,#a8743f 0 9px,#6b4423 9px 11px);box-shadow:-5px 0 0 #5a3a1e,5px 0 0 #5a3a1e}
  .h-tower{position:absolute;top:22px;width:56px;height:168px;background:repeating-linear-gradient(0deg,#a39a8d 0 20px,#8d8478 20px 22px);box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
  .h-tower::before{content:"";position:absolute;left:-4px;right:-4px;top:-12px;height:12px;background:repeating-linear-gradient(90deg,#a39a8d 0 12px,transparent 12px 20px)}
  .h-tower::after{content:"";position:absolute;left:50%;top:40px;width:10px;height:26px;transform:translateX(-50%);border-radius:5px 5px 0 0;background:#2a1f16}
  .h-wall{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#7d746a 0 22px,#6c645b 22px 24px),#7d746a;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
  .scene.dark .h-wall{background:repeating-linear-gradient(0deg,#4e4c56 0 22px,#43414a 22px 24px)}

  /* The castle map: a full-height card with three views (the castle, an area's map, a room's road). */
  .card.pick{display:flex;flex-direction:column;box-sizing:border-box;width:calc(100vw - 48px);height:calc(100dvh - 48px);max-height:920px;max-width:460px}
  .card.pick .map{flex:1;min-height:0;max-height:none}
  .pick-head{display:flex;align-items:center;justify-content:center;gap:10px;min-height:36px}
  .pick-head h3{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Big buttons back to the whole castle and (in a room) to its floor */
  .pick-nav{display:flex;gap:8px;margin-bottom:8px}
  .pick-nav[hidden]{display:none}
  .pick-nav button{flex:1;min-width:0;height:46px;border-radius:12px;font:600 17px Fredoka,system-ui;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 10px}
  .nav-castle{color:#3a2f22;background:linear-gradient(180deg,#ffe7a8,#f2b84b);border:0;box-shadow:0 3px 0 #b77d14}
  .nav-castle:active{transform:translateY(2px);box-shadow:0 1px 0 #b77d14}
  .pick-back{color:var(--ink);background:var(--bg2);border:2px solid #4a4155}
  .castle-view-wrap{background:#1b2342}
  .castle-view{position:relative;min-height:100%;box-sizing:border-box;padding:118px 10px 12px;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#1b2342 0,#3b4a78 150px,#7a8fb8 300px,#7a8fb8 70%,#4d7a33 70%,#3d5a35 100%)}
  .castle-view .star{position:absolute;color:#fff;font-size:10px;animation:twinkle 2s infinite}
  .castle-view .flag{position:absolute;left:38%;top:84px;font-size:16px;transform-origin:left;animation:flagwave 2s ease-in-out infinite}
  .castle-view .tower{position:absolute;right:12px;top:32px;width:104px;height:96px;background:#5d564d;border-radius:4px;padding:6px;box-sizing:border-box}
  .castle-view .tower .roof{position:absolute;left:-4px;top:-24px;border-left:56px solid transparent;border-right:56px solid transparent;border-bottom:26px solid #7a3a40}
  .castle-view .tower .band-floor{flex-direction:column;gap:0;text-align:center;padding:4px;min-height:80px;justify-content:center}
  .castle-view .tower .band-floor small:not(.bf-count),.castle-view .tower .bf-text small{display:none}
  .castle-view .tower .band-floor b{font-size:12px;line-height:1.1}
  .keep{position:relative;display:flex;flex-direction:column;gap:6px;padding:10px 8px;border-radius:4px;background:repeating-linear-gradient(0deg,#6c6257 0 20px,#5d564d 20px 22px)}

  .cellars{padding:8px;background:#2a2420;border-radius:0 0 6px 6px}

  .band-floor{position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:52px;box-sizing:border-box;padding:6px 10px;border:0;border-radius:6px;
    text-align:left;font-family:inherit;color:#3a2f22;cursor:pointer;background:linear-gradient(180deg,#fff3d6,#e9cf9a);box-shadow:inset 0 0 0 2px #b77d14}

    border:3px solid #6b4a24;border-radius:6px;background:#f6ead0;font-family:inherit;color:#3a2f22;cursor:pointer}
  .plan-room b{font:600 13px Fredoka,system-ui;line-height:1.1;text-align:center}
  .plan-room small{font-size:10px;font-weight:700;color:#8a5c10}
  .plan-room.done small{color:#3b6d11}
  .plan-room .pr-ic{font-size:20px}
  .plan-room.here{box-shadow:0 0 0 3px var(--gold),0 0 16px rgba(242,184,75,.8)}
  .plan-room .pr-mouse{position:absolute;right:4px;top:2px;font-size:16px;animation:bob 1.2s ease-in-out infinite;z-index:2}

    font:600 22px Fredoka,system-ui;color:#6b4a24;animation:pulse 1.8s ease-in-out infinite}
  .plan-room.next small{font-size:10px;line-height:1.1;color:#6b4a24}
  .plan-room.next.narrow small{writing-mode:vertical-rl;font-size:11px}

  .plan.outside .plan-room.far{background:#a9c27a;border-radius:12px}
  .plan-room.place{justify-content:flex-end;padding:0 0 4px;border-radius:12px;background:#b5cc86}

  .plan-room.place .pr-ic{display:none}
  .plan-room.place b,.plan-room.place small{position:relative;z-index:1;background:rgba(255,248,225,.88);padding:0 6px;border-radius:6px}
  .pa{position:absolute}
  .pa.sky{left:0;right:0;top:0;height:45%;background:linear-gradient(#a9d2ee,#d9eef7)}
  .pa.grass{left:0;right:0;bottom:0;height:55%;background:linear-gradient(#9cc46a,#7aa34c)}
  .pa.barn{left:10%;bottom:26%;width:42%;height:46%;background:#b0453a;clip-path:polygon(0 35%,50% 0,100% 35%,100% 100%,0 100%);box-shadow:inset 0 -10px 0 #8a3028}
  .pa.water{inset:0;background:repeating-linear-gradient(0deg,#6fa3c4 0 6px,#7fb2cf 6px 12px);animation:ripple 3s ease-in-out infinite}
  .pa.bridge{left:38%;top:0;bottom:0;width:24%;background:repeating-linear-gradient(0deg,#8a5a2b 0 6px,#6f4520 6px 8px)}
  .pa.gatehouse{left:16%;right:16%;bottom:0;top:22%;background:repeating-linear-gradient(0deg,#9a9083 0 10px,#857b70 10px 11px);
    clip-path:polygon(0 0,14% 0,14% 12%,28% 12%,28% 0,42% 0,42% 12%,58% 12%,58% 0,72% 0,72% 12%,86% 12%,86% 0,100% 0,100% 100%,62% 100%,62% 52%,50% 38%,38% 52%,38% 100%,0 100%)}
  .pe{position:absolute;font-size:16px;line-height:1}
  .pe.flutter{animation:flutter 3s ease-in-out infinite} .pe.drop{animation:drop 2.6s ease-in infinite}
  .pe.paddle{animation:paddle 5s ease-in-out infinite} .pe.wave{transform-origin:left;animation:flagwave 2s ease-in-out infinite}
  .stairs-row{display:flex;gap:10px;margin:0 14px 14px}

  .stairs.up{margin-left:auto} .stairs.locked{opacity:.65;cursor:default}
  .stairs.down:empty{display:none}
  .doorway.soon{justify-content:center;color:#2a2420}
  .reveal{animation:reveal 1.3s ease-out both}
  /* fog over rooms and floors you haven't reached: you can see they're there, not what they are */
  .fogged{overflow:hidden}
  .fog{position:absolute;inset:-20% -30%;z-index:1;pointer-events:none;filter:blur(3px);
    background:radial-gradient(ellipse 40% 30% at 25% 35%,rgba(255,255,255,.85),transparent 70%),
      radial-gradient(ellipse 45% 35% at 70% 60%,rgba(246,244,240,.8),transparent 70%),
      radial-gradient(ellipse 35% 25% at 45% 85%,rgba(255,255,255,.7),transparent 70%),rgba(214,210,204,.72);
    animation:fogDrift 8s ease-in-out infinite alternate}
  .band-floor .fog{background:radial-gradient(ellipse 30% 60% at 20% 40%,rgba(200,196,214,.5),transparent 70%),
      radial-gradient(ellipse 35% 70% at 75% 55%,rgba(190,186,204,.45),transparent 70%),rgba(120,114,134,.35)}
  .fog.lift{inset:0;animation:fogLift 1.8s .3s ease-out both}
  .fogged > :not(.fog){position:relative;z-index:2}

  .band-floor.locked.fogged small{margin-left:0}
  @keyframes fogDrift{from{transform:translateX(-8%)}to{transform:translateX(8%)}}

  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,184,75,0)}50%{box-shadow:0 0 0 6px rgba(242,184,75,.45)}}
  @keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
  @keyframes flagwave{0%,100%{transform:skewY(0)}50%{transform:skewY(-8deg)}}
  @keyframes ripple{0%,100%{opacity:.75}50%{opacity:1}}
  @keyframes flutter{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-6px)}}
  @keyframes drop{0%,60%{transform:translateY(0);opacity:1}90%{transform:translateY(26px);opacity:1}100%{transform:translateY(26px);opacity:0}}

  @keyframes drift{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
  @keyframes spark{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2)}}
  /* a room cleared: confetti on the win card */

  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .hint-ring b{position:absolute;right:-6px;top:-8px;font-size:16px;background:var(--bg);border-radius:50%;padding:1px}
  .piece,.animal.placed{touch-action:none}
  .ghost{position:fixed;left:0;top:0;z-index:20;pointer-events:none;display:grid;place-items:center;transform:translate(-50%,-75%) scale(1.15);filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
  .animal.lifted{opacity:.25}
  .floor.target{box-shadow:inset 0 0 0 3px var(--gold)}
  .floor.target.bad{box-shadow:inset 0 0 0 3px var(--red)}
  .tile{position:absolute;display:grid;place-items:center}
  .floor{background:var(--floor-a)}
  .floor.alt{background:var(--floor-b)}
  .floor.placeable{cursor:pointer}
  .board.armed .floor.placeable::after{content:"";width:34%;height:34%;border-radius:50%;background:rgba(201,138,28,.22)}
  .border{background:linear-gradient(180deg,var(--stone-l),var(--stone) 55%,var(--stone-d));box-shadow:inset 0 0 0 1px rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.18)}
  .wall{background:linear-gradient(180deg,#9c9284,#6b635a);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 0 3px 0 rgba(255,255,255,.2),0 3px 0 rgba(0,0,0,.25);border-radius:4px}
  .hole{background:linear-gradient(180deg,var(--stone-l),var(--stone) 55%,var(--stone-d))}
  /* Kitchen walls are counters: a butcher-block top over a wooden cupboard front */
  .board.walls-counter .wall,.g-counter{background:linear-gradient(180deg,#e6c79a 0 30%,#7b4f2c 30% 34%,#a46e43 34%);border-radius:4px;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.35),0 3px 0 rgba(0,0,0,.25)}
  /* Library walls are bookshelves: a wooden case with two rows of book spines */
  .board.walls-shelf .wall,.g-shelf{border-radius:4px;background:
      linear-gradient(180deg,#5b3a22 0 8%,transparent 8% 46%,#5b3a22 46% 54%,transparent 54% 92%,#5b3a22 92%),
      repeating-linear-gradient(90deg,#a8423a 0 14%,#d8b65a 14% 24%,#3f6a8a 24% 40%,#6b8a4a 40% 52%,#8a5a9a 52% 64%,#c7783a 64% 78%,#3a4a7a 78% 88%,#d9c7a3 88% 100%);
    box-shadow:inset 0 0 0 2px #5b3a22,inset 0 0 0 3px rgba(0,0,0,.25),0 3px 0 rgba(0,0,0,.25)}
  .board.walls-counter .wall::after,.g-counter::after{content:"";position:absolute;left:50%;top:62%;width:12%;height:8%;border-radius:2px;
    transform:translateX(-50%);background:#e8c37c;box-shadow:0 1px 0 rgba(0,0,0,.35)}
  /* Great hall walls are banquet tables: an oak top with a plate on it */
  .board.walls-table .wall,.g-table{border-radius:4px;background:repeating-linear-gradient(90deg,#a46e43 0 31%,#8a5a32 31% 34%),#a46e43;
    box-shadow:inset 0 0 0 2px #6b4423,inset 0 3px 0 rgba(255,255,255,.2),0 3px 0 rgba(0,0,0,.28)}
  .board.walls-table .wall::after,.g-table::after{content:"";position:absolute;left:50%;top:50%;width:46%;height:46%;border-radius:50%;transform:translate(-50%,-50%);
    background:radial-gradient(circle,#f4efe6 0 45%,#d9d2c4 46% 60%,#f4efe6 61%);box-shadow:0 1px 0 rgba(0,0,0,.3)}
  /* Ballroom walls are marble pillars, seen from above, on a square base */
  .board.walls-pillar .wall,.g-pillar{border-radius:3px;background:radial-gradient(circle at 42% 38%,#ffffff 0,#ebe5ee 30%,#c9c0cf 56%,#9a90a2 62%,transparent 64%),
    linear-gradient(135deg,#d9d2de,#b4abba);box-shadow:inset 0 0 0 2px #8f8698,0 3px 0 rgba(0,0,0,.25)}
  .board.walls-pillar .wall::after,.g-pillar::after{content:"";position:absolute;inset:16%;border-radius:50%;border:2px solid rgba(201,162,74,.75)}
  /* Chapel walls are pews, seen from above: a bench with a backrest */
  .board.walls-pew .wall,.g-pew{border-radius:4px;background:linear-gradient(180deg,#6b4423 0 26%,#8a5a32 26% 34%,#b07a45 34% 92%,#6b4423 92%);box-shadow:inset 0 0 0 2px #5a3a1e,0 3px 0 rgba(0,0,0,.28)}
  .board.walls-pew .wall::after,.g-pew::after{content:"";position:absolute;left:12%;right:12%;top:52%;height:10%;border-radius:2px;background:#7a2a3a}
  /* Secret passage walls are rough rock */
  .board.walls-rock .wall,.g-rock{border-radius:38% 46% 40% 50%/44% 38% 52% 46%;background:radial-gradient(circle at 34% 30%,#a8a2a8,#77717a 55%,#55505a);box-shadow:inset -3px -4px 0 rgba(0,0,0,.25),0 3px 0 rgba(0,0,0,.3)}
  .board.walls-rock .wall::after,.g-rock::after{content:"";position:absolute;left:24%;top:30%;width:30%;height:12%;border-radius:50%;background:rgba(255,255,255,.18);transform:rotate(-20deg)}
  /* Map room walls are map tables: a table with a chart on it */
  .board.walls-maptable .wall,.g-maptable{border-radius:4px;background:#7b4f2c;box-shadow:inset 0 0 0 2px #5a3a1e,0 3px 0 rgba(0,0,0,.28)}
  .board.walls-maptable .wall::after,.g-maptable::after{content:"";position:absolute;inset:16%;border-radius:2px;transform:rotate(-6deg);
    background:radial-gradient(ellipse at 35% 40%,#8fb36a 0 22%,transparent 24%),radial-gradient(ellipse at 70% 65%,#8fb36a 0 14%,transparent 16%),linear-gradient(135deg,#f2e2b8,#d8bf88)}
  /* Armory walls are weapon racks: a wooden frame holding blades */
  .board.walls-rack .wall,.g-rack{border-radius:3px;background:linear-gradient(90deg,transparent 18%,#c9ced6 18% 24%,transparent 24% 46%,#c9ced6 46% 52%,transparent 52% 74%,#c9ced6 74% 80%,transparent 80%),
    linear-gradient(180deg,#6b4423 0 12%,transparent 12% 82%,#6b4423 82%),#3f3a44;box-shadow:inset 0 0 0 2px #5a3a1e,0 3px 0 rgba(0,0,0,.28)}
  .board.walls-rack .wall::after,.g-rack::after{content:"";position:absolute;left:16%;right:16%;top:28%;height:8%;background:#c9a24a;border-radius:2px}
  /* Gallery walls are statues: a bust on a stone plinth */
  .board.walls-statue .wall,.g-statue{border-radius:3px;background:linear-gradient(180deg,#cfc9c0,#a9a297);box-shadow:inset 0 0 0 2px #857e74,inset 0 -6px 0 rgba(0,0,0,.12),0 3px 0 rgba(0,0,0,.25)}
  .board.walls-statue .wall::before,.g-statue::before{content:"";position:absolute;left:22%;right:22%;bottom:16%;height:30%;border-radius:50% 50% 12% 12%;background:linear-gradient(180deg,#f4f1ec,#d8d2c8)}
  .board.walls-statue .wall::after,.g-statue::after{content:"";position:absolute;left:50%;top:14%;width:32%;height:36%;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle at 40% 35%,#fbf9f6,#d8d2c8 75%)}
  .hole i{display:block;width:62%;height:62%;background:#120f14;border-radius:50% 50% 8% 8%;box-shadow:inset 0 4px 6px rgba(0,0,0,.8),0 0 0 3px rgba(242,184,75,.0)}
  .hole.in{background:var(--floor-a)} .hole.in.alt{background:var(--floor-b)}
  .hole.in i{width:66%;height:66%;border-radius:50%;box-shadow:inset 0 5px 7px rgba(0,0,0,.85),0 0 0 3px var(--stone-d)}
  .hole.t i{transform:rotate(180deg)} .hole.l i{transform:rotate(90deg)} .hole.r i{transform:rotate(-90deg)}
  .board.running .hole i,.board.edit .hole i{animation:glow 1.6s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:inset 0 4px 6px rgba(0,0,0,.8),0 0 0 3px rgba(242,184,75,.55)}}
  .animal{position:absolute;left:0;top:0;display:grid;place-items:center;transition:transform var(--glide,.15s) linear,opacity .25s;pointer-events:none;z-index:2}
  /* instant replay */
  .btn.replay{margin-top:12px;background:transparent;box-shadow:none;border:2px solid #574a66;font-size:15px;padding:10px}
  .controls.replay-controls{display:none}
  .replaying .controls:not(.replay-controls){display:none}
  .replaying .controls.replay-controls{display:grid}
  .replay-controls .speed{display:grid;grid-template-columns:1fr 1fr;background:var(--bg2);border:2px solid #4a4155;border-radius:16px;padding:3px;gap:3px}
  .replay-controls .speed button{font:600 16px Fredoka,system-ui;color:var(--muted);background:transparent;border:0;border-radius:12px;cursor:pointer}
  .replay-controls .speed button.on{background:var(--gold);color:#2b1d05}
  .replay-label{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:5;display:none;pointer-events:none;
    background:rgba(20,16,24,.85);color:var(--gold);font:600 14px Fredoka,system-ui;padding:5px 12px;border-radius:12px}
  .replaying .replay-label{display:block}
  .animal span{display:block;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25));transition:transform .12s}
  .animal.placed{pointer-events:auto;cursor:pointer}
  .animal.placed::before{content:"";position:absolute;inset:8%;border-radius:30%;background:rgba(242,184,75,.28);border:2px dashed var(--gold-d)}
  .animal.scared span{animation:hop .3s ease-out}
  @keyframes hop{40%{transform:translateY(-14%) scale(1.08)}}
  .animal.gone{opacity:0}
  /* Standoff: two animals heading for the same square, so neither moves (rulebook rule 4). */
  .animal.stuck::after{content:"!";position:absolute;top:0;right:2%;width:36%;height:36%;border-radius:50%;
    background:var(--red);color:#fff;font:700 14px Fredoka,system-ui;display:grid;place-items:center;
    box-shadow:0 2px 0 rgba(0,0,0,.3)}
  .animal.bump span{animation:bump .35s ease-in-out}
  @keyframes bump{25%{transform:translateX(-9%)}50%{transform:translateX(9%)}75%{transform:translateX(-5%)}}
  /* gentler hints: the animal your piece has to deal with, then a patch of board it goes in */
  .hint-area{position:absolute;z-index:1;pointer-events:none;border-radius:8px;background:rgba(242,184,75,.28);box-shadow:inset 0 0 0 3px rgba(242,184,75,.85)}
  .hint-ring{position:absolute;border:3px solid var(--gold);border-radius:30%;z-index:3;pointer-events:none;animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(.86);opacity:.6}}
  .tray{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid #3d3548;border-radius:16px;padding:10px 12px;min-height:66px}
  .tray .lbl{color:var(--muted);font-size:13px;width:52px;line-height:1.15}
  .piece{width:52px;height:52px;border-radius:14px;background:#3a3345;border:2px solid #51475e;display:grid;place-items:center;font-size:30px;cursor:pointer;position:relative}
  .piece.sel{border-color:var(--gold);background:#4a3f33;box-shadow:0 0 0 3px rgba(242,184,75,.25)}
  .piece.used{opacity:.25;cursor:default}
  .tray .empty{color:var(--muted);font-size:14px}
  .controls{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:10px}
  button.btn{font:600 18px Fredoka,system-ui;border:0;border-radius:16px;padding:14px 10px;color:var(--ink);background:#3a3345;box-shadow:0 4px 0 #26212d;cursor:pointer}
  button.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #26212d}
  button.go{background:linear-gradient(180deg,#f6c560,var(--gold-d));color:#2b1d05;box-shadow:0 4px 0 #8a5d10}
  button.go:active{box-shadow:0 1px 0 #8a5d10}
  button.btn:disabled{opacity:.45}
  .toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-20px);opacity:0;background:rgba(20,16,24,.92);color:var(--ink);padding:9px 14px;border-radius:12px;font-size:15px;white-space:nowrap;transition:.25s;z-index:5;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .overlay{position:fixed;inset:0;background:rgba(15,12,18,.7);display:none;place-items:center;z-index:10;padding:24px}
  .overlay.show{display:grid}
  /* How-to-play cards: before level 1, and when a new animal or board piece first appears */
  #guide{z-index:12}
  .card.guide{max-width:360px}
  .guide-art{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 8px;min-height:96px;margin:-4px 0 10px;
    border-radius:16px;background:radial-gradient(circle at 50% 60%,#4a3f58,#2f2838);padding:10px;font-size:44px;line-height:1}
  .guide-art span{display:inline-block;animation:bob 1.4s ease-in-out infinite}
  .guide-art span:nth-of-type(2n){animation-delay:.35s}
  .guide-art i{font:600 13px Fredoka,system-ui;font-style:normal;color:var(--gold)}
  .guide-art .g-row{display:flex;align-items:center;gap:8px;width:100%;justify-content:center}
  .guide-art .g-sq{width:40px;height:40px;border-radius:6px;background:#e7dcc6;box-shadow:inset 0 0 0 2px #b9a98d;animation:none}
  .guide-art .g-go{font:700 18px Fredoka,system-ui;color:#1d3a10;background:#8fd16a;border-radius:10px;padding:8px 12px;animation:none}
  .guide-art .g-pew,.guide-art .g-rock,.guide-art .g-maptable,.guide-art .g-rack,.guide-art .g-table,.guide-art .g-pillar,.guide-art .g-statue{position:relative;width:56px;height:56px;animation:none}
  .guide-art .g-counter,.guide-art .g-shelf{position:relative;width:56px;height:56px;animation:none}
  .card.guide h3{margin:0 0 6px}
  .card.guide p{margin:0 0 14px;font-size:16px;line-height:1.4;color:var(--ink)}
  .guide-dots{display:flex;justify-content:center;gap:6px;margin:-4px 0 12px}
  .guide-dots b{width:8px;height:8px;border-radius:50%;background:#574a66} .guide-dots b.on{background:var(--gold)}
  .guide-skip{margin-top:10px;background:transparent;box-shadow:none;color:var(--muted);font-size:15px;padding:6px}
  .guide-skip[hidden]{display:none}
  .link-btn{background:none;border:0;padding:0;font:inherit;color:var(--gold);text-decoration:underline;cursor:pointer}
  .card{background:linear-gradient(180deg,#3a3046,#2a2533);border:2px solid #574a66;border-radius:22px;padding:24px 22px;text-align:center;max-width:340px;width:100%;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.7);opacity:0}}
  .card .big{font-size:56px}
  .card h3{margin:6px 0 4px;font-size:26px}
  .card p{margin:0 0 18px;color:#e0d6c5;font-size:16px;line-height:1.4}
  .card .btn{width:100%}

  /* ======================================================================
     Flat medieval style. Flat two-tone colour, no outlines and no gradients.
     A thing's darker tone sits below or to its right, as if lit from the top-left.
     Titles use --font-title and everything else --font-body: change a font in one place.
     ====================================================================== */
  :root{
    --font-title:'Almendra',Georgia,serif; --font-body:Fredoka,ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
    --bg:#4a3328; --bg2:#3e2a20; --ink:#f1e3c2; --muted:#e0cb9c;
    --paper:#f1e3c2; --paper-d:#e0cb9c; --paper-ink:#2b1d14;
    --gold:#d9a43a; --gold-d:#b8862a; --red:#a8353a; --red-d:#842629; --rose:#d4917f; --rose-d:#b87666;
    --green:#7a9a4a; --green-d:#5f7d38; --navy:#2f4f8f; --navy-d:#233b6c;
    --stone:#a39c8f; --stone-d:#857e72; --stone-l:#b9b2a6;
    --floor-a:#f1e3c2; --floor-b:#e0cb9c;
  }
  html,body{background:var(--bg);color:var(--ink);font-family:var(--font-body)}
  .brand{font-family:var(--font-title);font-size:23px;letter-spacing:0;color:var(--paper)}
  .brand .crest{filter:none}
  .title h2,.card h3,.pick-head h3{font-family:var(--font-title);font-weight:700;color:inherit}
  .title h2{font-size:22px;color:var(--paper)}
  .title .sub{color:var(--muted)}
  /* pills and buttons: a flat face over a darker lip */
  .lvlbtn{font:600 15px var(--font-body);color:var(--paper-ink);background:var(--gold);border:0;border-radius:12px;box-shadow:0 4px 0 var(--gold-d)}
  .soundbtn{background:var(--paper);border:0;border-radius:12px;box-shadow:0 4px 0 var(--paper-d)}
  .cheese{font:600 14px var(--font-body);color:var(--paper-ink);background:var(--paper);box-shadow:0 2px 0 var(--paper-d)}
  .preview-banner{background:var(--gold);color:var(--paper-ink)}
  button.btn{font:600 18px var(--font-body);border-radius:16px;color:var(--paper-ink);background:var(--paper);box-shadow:0 4px 0 var(--paper-d)}
  button.btn:active{box-shadow:0 1px 0 var(--paper-d)}
  #resetBtn{background:var(--rose);box-shadow:0 4px 0 var(--rose-d)}
  #resetBtn:active{box-shadow:0 1px 0 var(--rose-d)}
  button.go{background:var(--red);color:var(--paper);box-shadow:0 4px 0 var(--red-d)}
  button.go:active{box-shadow:0 1px 0 var(--red-d)}
  /* the tip, the chain and the tray are paper cards on the brown page */
  .tip{background:var(--paper);border:0;color:var(--paper-ink);font-weight:500;box-shadow:0 4px 0 var(--paper-d)}
  .tip.boss{background:#f3d3c9;box-shadow:0 4px 0 var(--rose)}
  .tip.hinting{background:#f6dfa6;color:var(--paper-ink);box-shadow:0 4px 0 var(--gold)}
  .tip .link-btn,.tip a{color:var(--red)}
  .chain{background:var(--stone-d);border-radius:12px}
  .chain .arrow,.chain .cap{color:var(--paper)}
  .tray{background:var(--paper);border:0;box-shadow:0 4px 0 var(--paper-d)}
  .tray .lbl,.tray .empty{color:var(--paper-ink)}
  .piece{background:var(--paper-d);border:0;border-radius:14px;box-shadow:0 3px 0 var(--tan-d,#b39260)}
  .piece.sel{background:var(--gold);box-shadow:0 3px 0 var(--gold-d),0 0 0 3px rgba(217,164,58,.35)}
  /* the board: cream checks in a navy frame */
  .board{border-radius:14px;box-shadow:0 6px 0 var(--navy-d)}
  .border,.hole{background:var(--navy);box-shadow:none}
  .hole.in{background:var(--floor-a)} .hole.in.alt{background:var(--floor-b)}
  .hole i{background:#1a1210;box-shadow:none}
  .hole.in i{box-shadow:none}
  @keyframes glow{50%{box-shadow:0 0 0 3px rgba(217,164,58,.7)}}
  .wall{background:var(--stone);box-shadow:inset -6px -6px 0 var(--stone-d);border-radius:6px}
  .board.armed .floor.placeable::after{background:rgba(184,134,42,.25)}
  .floor.target{box-shadow:inset 0 0 0 3px var(--gold)}
  .floor.target.bad{box-shadow:inset 0 0 0 3px var(--red)}
  .hint-area{background:rgba(217,164,58,.28);box-shadow:inset 0 0 0 3px var(--gold)}
  .animal.placed::before{background:rgba(217,164,58,.3);border:2px dashed var(--gold-d)}
  .toast,.replay-label{background:var(--paper-ink);color:var(--paper)}
  .replay-controls .speed{background:var(--paper);border:0;box-shadow:0 4px 0 var(--paper-d)}
  .replay-controls .speed button{font-family:var(--font-body);color:var(--paper-ink)}
  .replay-controls .speed button.on{background:var(--gold);color:var(--paper-ink)}
  /* cards (win, how to play, the castle) are paper */
  .overlay{background:rgba(43,29,20,.72)}
  .card{background:var(--paper);color:var(--paper-ink);border:0;border-radius:22px;box-shadow:0 8px 0 var(--paper-d)}
  .card p{color:var(--paper-ink)}
  .card.pick p{color:#6e4126}
  .card .link-btn,.link-btn{color:var(--red)}
  .card button.btn:not(.go):not(.replay):not(.guide-skip):not(.danger){background:var(--paper-d);box-shadow:0 4px 0 #cfae78}
  .card button.btn:not(.go):not(.replay):not(.guide-skip):not(.danger):active{box-shadow:0 1px 0 #cfae78}
  .btn.replay{background:var(--navy);color:var(--paper);border:0;box-shadow:0 4px 0 var(--navy-d)}
  #win #nextBtn{background:var(--green);color:var(--paper);box-shadow:0 4px 0 var(--green-d)}
  #win h3{display:inline-block;margin:0 -30px 14px;padding:8px 26px;color:var(--paper);background:var(--red);border-radius:6px;box-shadow:0 5px 0 var(--red-d);font-size:24px}
  .card.guide p{color:var(--paper-ink)}
  .guide-art{background:var(--navy);box-shadow:0 5px 0 var(--navy-d)}
  .guide-art i{color:var(--gold)}
  .guide-dots b{background:var(--paper-d)} .guide-dots b.on{background:var(--gold)}
  .guide-skip{color:#6e4126;box-shadow:none!important;background:transparent!important}
  #guideNext{background:var(--gold);color:var(--paper-ink);box-shadow:0 4px 0 var(--gold-d)}
  .card.pick .danger{border:2px solid var(--red);color:var(--red)}
  .card.pick .danger.armed{background:var(--red);color:var(--paper)}
  .nav-castle{font-family:var(--font-body);color:var(--paper-ink);background:var(--gold);box-shadow:0 4px 0 var(--gold-d)}
  .nav-castle:active{box-shadow:0 1px 0 var(--gold-d)}
  .pick-back{color:var(--paper-ink);background:var(--paper-d);border:0;box-shadow:0 4px 0 #cfae78}
  .dot{font-family:var(--font-body)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="crest">🐭</span>Scare-a-Mouse</div>
    <div class="hdr-right"><button class="soundbtn" id="soundBtn" aria-label="Sound on">🔊</button>
    <button class="lvlbtn" id="lvlBtn"></button></div>
  </header>
  <div class="title"><h2 id="lvlName"></h2><span class="sub"><span id="lvlSub"></span><span class="cheese" id="cheese"></span></span></div>
  <div class="tip" id="tip"></div>
  <div class="chain" id="chain"></div>
  <div class="board-wrap"><div class="board" id="board"></div><div class="toast" id="toast"></div>
    <div class="replay-label" id="replayLabel">⏪ Instant replay</div></div>
  <div class="tray" id="tray"></div>
  <div class="controls">
    <button class="btn" id="hintBtn">Hint</button>
    <button class="btn" id="resetBtn">Reset</button>
    <button class="btn go" id="goBtn">Go!</button>
  </div>

  const roomExists = r => room(r).start < LEVELS.length;
  const roomReached = r => roomExists(r) && isOpen(room(r).start);
  // A room is cleared when all of its levels exist and are solved.
  const roomCleared = r => { const rm=room(r); if (rm.end > LEVELS.length) return false;
    for (let i=rm.start;i<rm.end;i++) if (!isDone(i)) return false; return true; };
  const areaReached = a => roomReached(roomsOf(a)[0]);
  const areaCleared = a => roomsOf(a).every(roomCleared);
  // Rooms and areas you have seen appear on the map (each appears with a little flourish once).
  // Progress from before the maps existed counts as seen.
  let seenRooms = store.get('cm_seen_rooms', null), seenAreas = store.get('cm_seen_areas', null);
  if (!seenRooms) { seenRooms = []; for (let r=0; roomExists(r); r++) if (roomReached(r)) seenRooms.push(r); store.set('cm_seen_rooms', seenRooms); }
  if (!doorsSeen) { doorsSeen = []; for (let r=0; roomExists(r); r++) if (roomCleared(r)) doorsSeen.push(r); store.set('cm_doors2', doorsSeen); }
  // Cheese: earned by solving a level the first time (3, or 1 if you used hints; double for bosses;
  // +5 for clearing a room) and spent on hints (1 for the area an animal goes in, 2 for the
  // square). New players start with 5; players who already had progress get 1 per level and 5 per room.
  let cheese = store.get('cm_cheese', null);
  if (cheese === null) { let c = 5; for (let r=0; roomExists(r); r++) if (roomCleared(r)) c += 5; cheese = c + doneCount(); store.set('cm_cheese', cheese); }
  // level key -> hints bought there (they stay bought). cm_hints counted three hints per animal (what to
  // aim at, area, square); cm_hints2 counts two (area, square), so hints already bought carry over.
  let hintsUsed = store.get('cm_hints2', null);
  if (!hintsUsed) { const old = store.get('cm_hints', {}); hintsUsed = {};
    for (const k in old) hintsUsed[k] = 2 * Math.floor(old[k] / 3) + Math.max(0, old[k] % 3 - 1);
    store.set('cm_hints2', hintsUsed); }
  const HINT_COST = { area:1, square:2 };
  function showCheese(bump){ const e=$('cheese'); e.textContent=`🧀 ${cheese}`; if(bump){ e.classList.remove('bump'); void e.offsetWidth; e.classList.add('bump'); } }
  function addCheese(n){ cheese = Math.max(0, cheese + n); store.set('cm_cheese', cheese); showCheese(n > 0); }
  if (!seenAreas) { seenAreas = AREAS.map((_,a)=>a).filter(a => roomsOf(a).length && areaReached(a)); store.set('cm_seen_areas', seenAreas); }
  const markSeen = () => {
    for (let r=0; roomExists(r); r++) if (roomReached(r) && !seenRooms.includes(r)) seenRooms.push(r);
    AREAS.forEach((_,a) => { if (roomsOf(a).length && areaReached(a) && !seenAreas.includes(a)) seenAreas.push(a); });
    store.set('cm_seen_rooms', seenRooms); store.set('cm_seen_areas', seenAreas);
  };

  // What the castle map shows: the whole castle, one area's map, or one room's road.
  let view = { kind: 'castle' };
  let mouseRoom = null;   // where the map's mouse stands (the current level's room, or a room just opened)

  const solvedIn = r => { const rm=room(r); let n=0; for (let i=rm.start; i<Math.min(rm.end, LEVELS.length); i++) if (isDone(i)) n++; return n; };
  const areaSolved = a => roomsOf(a).reduce((n,r)=>n+solvedIn(r),0);
  const areaSize = a => roomsOf(a).reduce((n,r)=>n+room(r).end-room(r).start,0);

  // Little illustrations for the places outside the castle.
  const PLACE_ART = {
    'Meadow': `<span class="pa sky"></span><span class="pa grass"></span><span class="pe" style="left:12%;top:46%">🌼</span><span class="pe" style="left:30%;top:60%">🌷</span><span class="pe" style="left:70%;top:50%">🌸</span><span class="pe" style="left:84%;top:64%">🌼</span><span class="pe flutter" style="left:52%;top:22%">🦋</span><span class="pe" style="left:4%;top:16%;font-size:22px">🌳</span>`,
    'Orchard': `<span class="pa sky"></span><span class="pa grass"></span><span class="pe" style="left:4%;top:12%;font-size:26px">🌳</span><span class="pe" style="left:36%;top:6%;font-size:26px">🌳</span><span class="pe" style="left:70%;top:12%;font-size:26px">🌳</span><span class="pe drop" style="left:20%;top:30%">🍎</span><span class="pe" style="left:56%;top:58%">🧺</span><span class="pe" style="left:84%;top:52%">🍐</span>`,
    'Stables': `<span class="pa sky"></span><span class="pa grass"></span><span class="pa barn"></span><span class="pe" style="left:64%;top:44%;font-size:22px">🐴</span><span class="pe" style="left:86%;top:58%">🌾</span><span class="pe" style="left:6%;top:60%">🐓</span>`,
    'Moat bridge': `<span class="pa water"></span><span class="pa bridge"></span><span class="pe paddle" style="left:12%;top:58%">🦆</span><span class="pe" style="left:80%;top:30%">🪷</span><span class="pe" style="left:86%;top:62%">🐸</span>`,
    'Gate': `<span class="pa sky"></span><span class="pa gatehouse"></span><span class="pe wave" style="left:14%;top:2%">🚩</span><span class="pe wave" style="left:78%;top:2%">🚩</span>`,
  };

  // A map box: one block per room of the area, joined by corridors in order.
  function areaMap(a) {
    const rs = roomsOf(a), outside = AREAS[a].kind === 'outside';
    const firstMissing = rs.find(r => !roomReached(r));
    let corridors = '', blocks = '';
    rs.forEach((r, k) => {
      const rm = room(r), [x,y,w,h] = rm.plan;
      if (k) { const [px,py,pw,ph] = room(rs[k-1]).plan;
        // L-shaped corridor: across from the last room, then up or down into this one
        const ax=px+pw/2, ay=py+ph/2, bx=x+w/2, by=y+h/2;
        corridors += `<polyline points="${ax},${ay} ${bx},${ay} ${bx},${by}" />`; }
      const pos = `left:${x}%;top:${y}%;width:${w}%;height:${h}%`;
      if (roomReached(r)) {
        const n = rm.end - rm.start, s = solvedIn(r), done = roomCleared(r), here = r === mouseRoom;
        const fresh = !seenRooms.includes(r) ? ' reveal' : '';
        const lift = fresh ? '<span class="fog lift"></span>' : '';  // the fog clears off a room you just reached
        const boss = rm.end === areaEnd(a) ? '<span class="crown">👑</span>' : '';
        blocks += `<button class="plan-room${outside?' place':''}${done?' done':''}${here?' here':''}${fresh}" data-r="${r}" style="${pos}">
          ${outside ? `<span class="art">${PLACE_ART[rm.name]||''}</span>` : ''}
          <span class="pr-ic">${rm.ic}</span><b>${rm.name}</b><small>${done ? '✓ ' : ''}${s}/${n}</small>${boss}
          ${here ? '<span class="pr-mouse">🐭</span>' : ''}${lift}</button>`;
      } else if (r === firstMissing) {
        blocks += `<div class="plan-room next fogged${w < 20 ? ' narrow' : ''}" style="${pos}"><span class="fog"></span><span class="fog-q">${roomExists(r) ? '?' : `<small>coming${w < 20 ? ' ' : '<br>'}soon</small>`}</span></div>`;
      } else {
        blocks += `<div class="plan-room far fogged" style="${pos}"><span class="fog"></span></div>`;
      }
    });
    const up = AREAS[a+1] && roomsOf(a+1).length ? a+1 : null, down = a > 0 ? a-1 : null;
    const stairs = `${down!==null ? `<button class="stairs down" data-a="${down}">${outside ? '' : (a===1 ? '⬇ Outside' : `⬇ ${AREAS[down].name}`)}</button>` : ''}
      ${up!==null ? `<button class="stairs up${areaReached(up)?'':' locked'}" data-a="${up}" ${areaReached(up)?'':'disabled'}>${areaReached(up) ? `⬆ ${outside ? 'Into the castle' : AREAS[up].name}` : (outside ? '🔒 Into the castle' : '🔒 Upstairs')}</button>` : ''}`;
    return `<div class="plan ${outside ? 'outside' : 'floor'}${AREAS[a].kind === 'cellars' ? ' cellars' : ''}">
      ${outside ? '<span class="castle-wall"></span><span class="moat"></span>' : ''}
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" class="corridors">${corridors}</svg>
      ${blocks}</div><div class="stairs-row">${stairs}</div>`;
  }

  // The whole castle, side on: the Outside in front, floors stacked inside, cellars below.
  function castleMap() {
    const band = (a, cls='') => {
      const A = AREAS[a], rs = roomsOf(a);
      if (!rs.length) return '';
      const reached = areaReached(a), done = areaCleared(a), here = mouseRoom !== null && room(mouseRoom).area === a;
      const prevReached = a === 0 || areaReached(a-1);
      const fresh = reached && !seenAreas.includes(a) ? ' reveal' : '';
      // Floors you haven't reached are under fog: you can see there's a floor, not what's on it.
      if (!reached) return `<div class="band-floor locked fogged ${cls}${prevReached && roomExists(rs[0]) ? ' next' : ''}"><span class="fog"></span>
        <b>🔒</b><small>${roomExists(rs[0]) ? `${rs.length} room${rs.length > 1 ? 's' : ''}` : 'coming soon'}</small></div>`;
      return `<button class="band-floor ${cls}${done?' done':''}${here?' here':''}${fresh}" data-a="${a}"><span class="bf-ic">${A.ic}</span>
        <span class="bf-text"><b>${A.name}</b><small>${rs.map(r => roomReached(r) ? room(r).name : '?').join(' · ')}</small></span>
        <small class="bf-count">${done ? '✓' : `${areaSolved(a)}/${areaSize(a)}`}</small>${here?'<span class="pr-mouse">🐭</span>':''}${fresh ? '<span class="fog lift"></span>' : ''}</button>`;
    };
    const order = [7,6,5,4,3,2];  // floors inside the keep, top to bottom
    return `<div class="castle-view">
      <span class="star" style="left:14%;top:4%">✦</span><span class="star" style="left:46%;top:7%;animation-delay:.8s">✦</span>
      <div class="tower"><div class="roof"></div>${band(8,'tower-band')}</div>
      <span class="flag">🚩</span>
      <div class="keep"><div class="battlement"></div>${order.map(a=>band(a)).join('')}</div>
      <div class="cellars">${band(1)}</div>
      <div class="moat-band"><span class="drawbridge"></span></div>
      <div class="outside-band">${band(0)}</div>
    </div>`;
  }

  // ---------- Room scenes ----------
  // Each room is a drawn scene: you come in at the bottom, and the road winds up past the room's
  // furniture to the door out at the top. The road swings from side to side; each swing leaves a
  // pocket on the other side, where a piece of furniture (a "prop") goes.
  const SCENE = { W: 350, GAP: 64, HEAD: 190, FOOT: 96, SWING: 172 };
  // Catmull-Rom through pts ([x%, y px]); returns the curve sampled finely, with running length.
  function sampleRoad(pts) {
    const out = [], px = p => [p[0] * SCENE.W / 100, p[1]];
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i-1] || pts[i], b = pts[i], c = pts[i+1], d = pts[i+2] || c;
      for (let s = 0; s < 24; s++) {
        const t = s / 24, t2 = t*t, t3 = t2*t;
        const f = k => 0.5 * ((2*b[k]) + (-a[k]+c[k])*t + (2*a[k]-5*b[k]+4*c[k]-d[k])*t2 + (-a[k]+3*b[k]-3*c[k]+d[k])*t3);
        out.push([f(0), f(1)]);
      }
    }
    out.push(pts[pts.length-1].slice());
    let len = 0; out[0][2] = 0;
    for (let i = 1; i < out.length; i++) { const [x0,y0] = px(out[i-1]), [x1,y1] = px(out[i]); len += Math.hypot(x1-x0, y1-y0); out[i][2] = len; }
    return out;
  }
  // The road for n levels: control points from the bottom (y = 0) up to y = V, swinging side to side.
  function sceneLayout(n) {
    const target = SCENE.GAP * (n + 1);
    const ctrl = V => { const m = Math.max(1, Math.round(V / SCENE.SWING)), sw = V / m, pts = [[50, 0]];
      for (let k = 1; k <= m; k++) pts.push([k % 2 ? 22 : 78, sw * (k - 0.5)]);
      pts.push([50, V]); return { pts, sw, m }; };
    let V = target * 0.62, c, smp;
    for (let it = 0; it < 6; it++) { c = ctrl(V); smp = sampleRoad(c.pts); V *= target / smp[smp.length-1][2]; }
    c = ctrl(V); smp = sampleRoad(c.pts);
    const H = SCENE.HEAD + V + SCENE.FOOT, Y = y => SCENE.HEAD + V - y;   // scene y (down) from road y (up)
    const at = dist => { let i = 1; while (i < smp.length - 1 && smp[i][2] < dist) i++;
      const p = smp[i-1], q = smp[i], f = (dist - p[2]) / Math.max(1e-6, q[2] - p[2]);
      return [p[0] + (q[0]-p[0])*f, Y(p[1] + (q[1]-p[1])*f)]; };
    const nodes = []; for (let k = 0; k < n; k++) nodes.push(at(SCENE.GAP * (k + 1)));
    // pockets: beside each swing, on the side away from the road
    const pockets = c.pts.slice(1, -1).map(([x, y]) => ({ x: x < 50 ? 73 : 27, y: Y(y), side: x < 50 ? 'r' : 'l' }));
    // small spots near the walls, where the road crosses the middle
    const spots = []; for (let k = 0; k <= c.m; k++) { const y = Y(c.sw * k); spots.push({ y, side: k % 2 ? 'l' : 'r' }); }
    const pts = [[50, H - 8], ...c.pts.map(([x, y]) => [x, Y(y)]), [50, SCENE.HEAD - 30]];
    let d = `M ${pts[0][0]} ${pts[0][1]}`;
    for (let i = 0; i < pts.length - 1; i++) { const a = pts[i-1] || pts[i], b = pts[i], cc = pts[i+1], e = pts[i+2] || cc;
      d += ` C ${(b[0]+(cc[0]-a[0])/6).toFixed(2)} ${(b[1]+(cc[1]-a[1])/6).toFixed(1)}, ${(cc[0]-(e[0]-b[0])/6).toFixed(2)} ${(cc[1]-(e[1]-b[1])/6).toFixed(1)}, ${cc[0]} ${cc[1].toFixed(1)}`; }
    const road = smp.filter((_, k) => k % 4 === 0).map(([x, y]) => [x, Y(y)]);
    return { H, nodes, pockets, spots, d, road };
  }

  // Prop art. Each prop is drawn in a 120x100 box with plain shapes and a few emoji.
  const S = (css, inner = '') => `<i style="${css}">${inner}</i>`;
  const E = (e, css = '') => `<i class="e" style="${css}">${e}</i>`;
  const shade = (l, t, w, h) => S(`left:${l}px;top:${t}px;width:${w}px;height:${h}px;border-radius:50%;background:rgba(0,0,0,.2)`);
  const canopy = (l, t, s, c1 = '#86c35e', c2 = '#3d7a2b') => S(`left:${l}px;top:${t}px;width:${s}px;height:${s*.88}px;border-radius:50%;background:radial-gradient(circle at 35% 30%,${c1},${c2} 72%);box-shadow:inset -5px -7px 0 rgba(0,0,0,.13)`);
  const barrel = (l, t, w = 30, h = 40) => S(`left:${l}px;top:${t}px;width:${w}px;height:${h}px;border-radius:9px/13px;background:linear-gradient(90deg,#6a4122,#b47c47 45%,#6a4122);box-shadow:inset 0 8px 0 -5px #3a2414,inset 0 -8px 0 -5px #3a2414,0 3px 0 rgba(0,0,0,.25)`);
  const crate = (l, t, s = 34) => S(`left:${l}px;top:${t}px;width:${s}px;height:${s}px;box-sizing:border-box;border:3px solid #7a5530;border-radius:2px;background:linear-gradient(45deg,transparent 44%,#8a6238 44% 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,#8a6238 44% 56%,transparent 56%),#c99d63;box-shadow:0 3px 0 rgba(0,0,0,.25)`);
  const sack = (l, t, w = 32, label = '') => S(`left:${l}px;top:${t}px;width:${w}px;height:${w*1.1}px;border-radius:40% 40% 30% 30%/50% 50% 25% 25%;background:radial-gradient(circle at 40% 35%,#eadbb8,#c7ad7c 75%);box-shadow:0 3px 0 rgba(0,0,0,.2);font:700 7px Fredoka,system-ui;color:#7a5f3a;display:grid;place-items:center`, label);
  const plank = (l, t, w, h, c = '#8a5a32') => S(`left:${l}px;top:${t}px;width:${w}px;height:${h}px;border-radius:3px;background:${c};box-shadow:0 3px 0 rgba(0,0,0,.25)`);
  const PROP = {
    tree: () => shade(28, 82, 66, 14) + plank(54, 50, 12, 38, '#6b4423') + canopy(22, 2, 76) + canopy(12, 26, 40) + canopy(68, 24, 40),
    pine: () => shade(32, 84, 56, 12) + plank(55, 66, 10, 22, '#5a3a1e') + S('left:30px;top:0;width:60px;height:74px;clip-path:polygon(50% 0,100% 100%,0 100%);background:linear-gradient(90deg,#2f6a33,#4f9a4a 50%,#2f6a33)'),
    appletree: () => PROP.tree() + S('left:38px;top:18px;width:9px;height:9px;border-radius:50%;background:#d8322c;box-shadow:20px 8px 0 #e0402c,36px -4px 0 #d8322c,-14px 22px 0 #e0402c,10px 30px 0 #d8322c,44px 26px 0 #e0402c,30px 40px 0 #c92a26') + E('🍎', 'left:70px;top:80px;font-size:15px'),
    flowers: () => S('left:10px;top:40px;width:100px;height:46px;border-radius:50%;background:radial-gradient(ellipse,#5f9a3e,transparent 70%)') +
      ['🌼:18:40', '🌷:44:30', '🌸:70:42', '🌼:56:58', '🌷:28:62', '🌸:84:62', '🌼:96:36'].map((s, k) => { const [e, l, t] = s.split(':'); return E(e, `left:${l}px;top:${t}px;font-size:18px;animation:sway ${2 + k % 3 * .4}s ease-in-out infinite`); }).join(''),
    pond: () => S('left:4px;top:26px;width:112px;height:62px;border-radius:50%;background:radial-gradient(ellipse at 40% 38%,#9ad6ee,#3f86b0 74%);box-shadow:0 0 0 4px #6f9a4a,0 0 0 7px rgba(0,0,0,.12)') +
      S('left:30px;top:44px;width:34px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.55);animation:sripple 2.6s ease-out infinite') +
      E('🪷', 'left:72px;top:50px;font-size:17px') + E('🦆', 'left:24px;top:36px;font-size:22px;animation:paddle 5s ease-in-out infinite') + E('🐸', 'left:90px;top:22px;font-size:16px'),
    beehive: () => shade(30, 82, 60, 12) + plank(56, 60, 8, 26, '#6b4423') + plank(36, 56, 48, 7, '#7a5530') +
      S('left:40px;top:16px;width:40px;height:42px;border-radius:50% 50% 8px 8px;background:repeating-linear-gradient(180deg,#e0ac48 0 7px,#a8742a 7px 9px);box-shadow:inset -5px 0 0 rgba(0,0,0,.12)') +
      S('left:55px;top:44px;width:10px;height:8px;border-radius:5px 5px 0 0;background:#3a2414') +
      E('🐝', 'left:84px;top:14px;font-size:14px;animation:orbit 3s linear infinite') + E('🐝', 'left:20px;top:30px;font-size:12px;animation:orbit 4s linear infinite reverse'),
    picnic: () => S('left:16px;top:28px;width:88px;height:56px;transform:rotate(-8deg);border-radius:4px;background:repeating-conic-gradient(#d8443c 0 25%,#f6efe2 0 50%) 0 0/14px 14px;box-shadow:0 3px 0 rgba(0,0,0,.2)') +
      E('🧺', 'left:28px;top:30px;font-size:26px') + E('🍎', 'left:66px;top:44px;font-size:15px') + E('🥪', 'left:58px;top:24px;font-size:16px'),
    hay: () => shade(14, 80, 92, 14) + ['10:46', '54:46', '32:16'].map(s => { const [l, t] = s.split(':'); return S(`left:${l}px;top:${t}px;width:52px;height:36px;border-radius:8px;background:repeating-linear-gradient(90deg,#ecc85e 0 6px,#d4a83e 6px 8px);box-shadow:inset 0 -5px 0 rgba(0,0,0,.12),0 3px 0 rgba(0,0,0,.18)`); }).join('') + E('🐓', 'left:86px;top:20px;font-size:20px;animation:peck 2.2s ease-in-out infinite'),
    fence: () => plank(0, 44, 120, 7, '#9a6a3a') + plank(0, 64, 120, 7, '#9a6a3a') + [6, 40, 74, 108].map(l => plank(l, 32, 9, 50, '#7a5530')).join('') + E('🌾', 'left:20px;top:70px;font-size:16px') + E('🌾', 'left:90px;top:72px;font-size:14px'),
    stall: () => shade(8, 86, 104, 12) + S('left:10px;top:20px;width:100px;height:68px;background:repeating-linear-gradient(90deg,#9a6a3a 0 12px,#86592f 12px 14px);border-radius:2px') +
      S('left:4px;top:8px;width:112px;height:16px;background:#7a3a28;border-radius:4px 4px 0 0;box-shadow:0 3px 0 rgba(0,0,0,.25)') +
      S('left:30px;top:34px;width:60px;height:54px;background:#3a2414;border-radius:4px 4px 0 0') + S('left:30px;top:58px;width:60px;height:30px;background:repeating-linear-gradient(90deg,#9a6a3a 0 10px,#7a5530 10px 12px)') + E('🐴', 'left:44px;top:30px;font-size:30px;animation:nod 3s ease-in-out infinite'),
    trough: () => shade(10, 74, 100, 12) + S('left:12px;top:46px;width:96px;height:28px;border-radius:4px;background:linear-gradient(180deg,#9a6a3a,#6b4423)') + S('left:17px;top:48px;width:86px;height:8px;border-radius:3px;background:#6fb3d8') + E('🥕', 'left:84px;top:28px;font-size:16px;transform:rotate(30deg)') + E('🍎', 'left:20px;top:30px;font-size:14px'),
    cart: () => shade(10, 84, 100, 12) + S('left:14px;top:34px;width:84px;height:30px;border-radius:3px;background:repeating-linear-gradient(90deg,#a8743f 0 14px,#8a5a32 14px 16px);box-shadow:0 3px 0 rgba(0,0,0,.25)') +

  // One room's scene (the level picker's room view).
  function roomRoad(r) {
    const rm = room(r), from = rm.start, to = Math.min(LEVELS.length, rm.end), n = Math.max(1, to - from);
    const sc = SCENES[rm.name] || DEFAULT_SCENE, outdoor = OUTDOOR_HEADS.includes(sc.head);
    const L8 = sceneLayout(n), rnd = mulberry(r * 7919 + 13);
    const [rOut, rIn, rDash, rDashArr] = ROADS[sc.road];
    let nodes = '';
    L8.nodes.forEach(([x, y], k) => {
      const i = from + k, pos = `left:${x.toFixed(2)}%;top:${y.toFixed(1)}px`, boss = isBoss(i) ? ' boss' : '';
      nodes += isOpen(i)
        ? `<div class="node${boss} ${i===li?'cur':''} ${isDone(i)?'done':''}" data-i="${i}" style="${pos}">${i+1}</div>`
        : `<div class="node locked${boss}" data-i="${i}" title="Locked" style="${pos}"><span class="lk">🔒</span><span>${i+1}</span></div>`;
    });
    if (li >= from && li < to) { const [x, y] = L8.nodes[li - from]; nodes += `<div class="walker" style="left:${x.toFixed(2)}%;top:${y.toFixed(1)}px"><span>🐭</span></div>`; }
    // furniture in the pockets beside each swing of the road
    const props = L8.pockets.map((p, k) => { const name = sc.props[k % sc.props.length];
      return `<div class="prop ${p.side}" style="left:${p.x}%;top:${p.y.toFixed(0)}px">${PROP[name]()}</div>`; }).join('');
    // small things by the walls where the road crosses the middle; torches on indoor walls
    let small = '';
    L8.spots.forEach((s, k) => { if (s.y < SCENE.HEAD + 30 || s.y > L8.H - SCENE.FOOT) return;
      const e = sc.small[Math.floor(rnd() * sc.small.length)], l = s.side === 'l' ? 7 + rnd() * 5 : 88 - rnd() * 5;
      if (sc.torch && k % 2) small += `<span class="torch" style="${s.side === 'l' ? 'left:6px' : 'right:-7px'};top:${s.y.toFixed(0)}px">🔥</span>`;
      else small += `<span class="deco" style="left:${l.toFixed(1)}%;top:${(s.y + (rnd() - .5) * 30).toFixed(0)}px">${e}</span>`; });
    // ground detail scattered wherever the road and furniture aren't: grass, straw, pebbles
    const bits = { meadow:'tuft', orchard:'tuft', bank:'tuft', field:'tuft', yard:'straw', flags:'pebble', cellar:'pebble', dungeon:'pebble', kitchen:'crumb' }[sc.floor];
    let ground = '';
    if (bits) {
      const W = SCENE.W, far = (x, y) => L8.road.every(([rx, ry]) => Math.hypot((rx - x) * W / 100, ry - y) > 36) && L8.pockets.every(p => Math.abs((p.x - x) * W / 100) > 66 || Math.abs(p.y - y) > 56);
      const count = Math.round(L8.H / 22);
      for (let k = 0; k < count; k++) { const x = 3 + rnd() * 94, y = SCENE.HEAD + 10 + rnd() * (L8.H - SCENE.HEAD - SCENE.FOOT);
        if (far(x, y)) ground += `<i class="bit ${bits}" style="left:${x.toFixed(1)}%;top:${y.toFixed(0)}px;transform:scale(${(.7 + rnd() * .6).toFixed(2)}) rotate(${((rnd() - .5) * 40).toFixed(0)}deg)"></i>`; }
    }
    // a few things drifting across the room: butterflies, falling leaves, bats, drips, dust
    let amb = '';
    for (let k = 0; k < Math.min(6, Math.round(L8.H / 320)); k++) { const e = sc.ambient.length ? sc.ambient[k % sc.ambient.length] : null; if (!e) break;
      const y = SCENE.HEAD + rnd() * (L8.H - SCENE.HEAD - SCENE.FOOT), x = 8 + rnd() * 84, dur = (7 + rnd() * 6).toFixed(1), dl = (-rnd() * 8).toFixed(1);
      amb += e === '·' ? `<i class="mote" style="left:${x.toFixed(0)}%;top:${y.toFixed(0)}px;animation-duration:${dur}s;animation-delay:${dl}s"></i>`
        : `<i class="amb amb-${['💧','💨'].includes(e) ? 'fall' : ['🍂','🍃'].includes(e) ? 'leaf' : 'fly'}" style="left:${x.toFixed(0)}%;top:${y.toFixed(0)}px;animation-duration:${dur}s;animation-delay:${dl}s">${e}</i>`; }
    // the door out, at the top
    let exit;
    if (rm.end <= LEVELS.length) {
      const next = room(r+1), cleared = roomCleared(r), seen = doorsSeen.includes(r);
      const label = cleared ? `To the ${next.name}` : `Solve all ${rm.end-rm.start} levels to open the door`;
      exit = `<div class="doorway ${cleared && seen ? 'open' : ''} ${cleared && !seen ? 'to-open' : ''}" data-r="${r}">
        <div class="arch"><div class="leaf"><span class="lock">${cleared ? '' : '🔒'}</span></div></div>
        <div class="label">${label}</div></div>`;
    } else exit = `<div class="doorway soon"><div class="label">More levels coming soon</div></div>`;
    const came = r > 0 ? `From the ${room(r-1).name}` : 'Start here';
    return `<section class="room scene f-${sc.floor}${sc.dark ? ' dark' : ''}${outdoor ? ' outdoor' : ''}${rm.night ? ' night' : ''}" data-room="${r}" style="--rb:${rm.bg}">
      <div class="room-head"><span class="ic">${rm.ic}</span><b>${rm.name}</b><small>${LEVELS[from].w}×${LEVELS[from].h} · ${solvedIn(r)}/${rm.end-rm.start}</small>
        ${DEV && rm.end <= LEVELS.length ? `<button class="devtest" data-r="${r}">Test</button>` : ''}</div>
      <div class="room-body" style="height:${L8.H.toFixed(0)}px">
        <div class="scene-head hk-${sc.head}">${sceneHead(sc.head, rm)}</div>
        ${outdoor ? '' : '<div class="wall-side l"></div><div class="wall-side r"></div>'}
        <svg viewBox="0 0 100 ${L8.H.toFixed(0)}" preserveAspectRatio="none">
          <path d="${L8.d}" fill="none" stroke="${rOut}" stroke-width="34" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
          <path d="${L8.d}" fill="none" stroke="${rIn}" stroke-width="26" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
          <path d="${L8.d}" fill="none" stroke="${rDash}" stroke-width="${sc.road === 'carpet' || sc.road === 'rug' ? 2 : 4}" stroke-dasharray="${rDashArr}" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
        ${ground}${props}${small}${amb}
        <div class="exit">${exit}</div>
        <div class="entry"><i class="arch-in"></i><small>${came}</small></div>
        ${nodes}
      </div></section>`;
  }
  // Small seeded random numbers, so each room's scattered bits stay put between visits.
  function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  function renderDots(){
    if (mouseRoom === null) mouseRoom = roomIndexOf(li);

    } else {
      title = 'The castle';

    m.scrollTop = 0;
    if (view.kind === 'castle') centerOn('.band-floor.reveal') || centerOn('.band-floor.here');
    $('pickTitle').textContent = title;
    // Castle button on every map but the castle; in a room, a second button back to its floor
    $('pickNav').hidden = view.kind === 'castle';
    $('howToWrap').hidden = view.kind !== 'castle';
    $('pickCastle').onclick = () => { view = { kind:'castle' }; renderDots(); };

    if (back) { $('pickBack').textContent = `‹ ${back.label}`; $('pickBack').onclick = () => { view = back; renderDots(); }; }
    // taps: areas open their map, rooms their road, levels load
    m.querySelectorAll('.band-floor[data-a], .stairs[data-a]:not([disabled])').forEach(b => b.onclick = () => { view = { kind:'area', a: +b.dataset.a }; renderDots(); });
    m.querySelectorAll('.plan-room[data-r]').forEach(b => b.onclick = () => { view = { kind:'room', r: +b.dataset.r }; renderDots(); centerOn('.node.cur') || (m.scrollTop = 0); });
    m.querySelectorAll('.node:not(.locked)').forEach(d=>d.onclick=()=>{ $('picker').classList.remove('show'); load(+d.dataset.i); });

    m.querySelectorAll('.devtest').forEach(btn => btn.onclick = () => {
      const r = +btn.dataset.r, rm = room(r);
      for (let i = rm.start; i < rm.end - 1; i++) solved[levelKey(LEVELS[i])] = LEVELS[i].solution.map(p=>({...p}));
      delete solved[levelKey(LEVELS[rm.end-1])]; store.set('cm_solved', solved);
      doorsSeen = doorsSeen.filter(x => x !== r); store.set('cm_doors2', doorsSeen);

    $('progress').textContent = `${doneCount()} of ${LEVELS.length} solved` + (DEV ? ' · developer mode' : '');
    $('resetProgress').classList.toggle('hidden', !DEV);
    $('lvlBtn').textContent = `Level ${li+1} ▾`;
  }
  // Scrolls the map so the first element matching sel is in the middle; false if there is none.
