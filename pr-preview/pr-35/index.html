<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scare-a-Mouse">
<meta name="theme-color" content="#1d1a24">
<title>Scare-a-Mouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1d1a24; --bg2:#2a2533; --stone:#8d8478; --stone-d:#5d564d; --stone-l:#b3aa9c;
    --floor-a:#e9dfc9; --floor-b:#ddd1b6; --ink:#f6efe2; --muted:#b9ae9c;
    --gold:#f2b84b; --gold-d:#c98a1c; --red:#e0664f; --green:#7cc47a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:radial-gradient(120% 80% at 50% 0%,#3a3046 0%,var(--bg) 60%);color:var(--ink);
    font-family:Fredoka,ui-rounded,"SF Pro Rounded",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none}
  .app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;
    padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 14px)}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .hdr-right{display:flex;align-items:center;gap:8px}
  .soundbtn{font-size:18px;line-height:1;background:var(--bg2);border:2px solid #4a4155;border-radius:12px;padding:7px 9px;cursor:pointer}
  .soundbtn.off{opacity:.6}
  .brand,.lvlbtn{white-space:nowrap}
  @media (max-width:420px){ .brand{font-size:19px;gap:6px} .brand .crest{font-size:21px} .lvlbtn{padding:7px 10px} }
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:22px;letter-spacing:.3px}
  .preview-banner{background:var(--gold);color:#2b1d05;font-size:13px;font-weight:600;text-align:center;border-radius:10px;padding:6px 10px}
  .brand .crest{font-size:24px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
  .dots{display:flex;gap:6px}
  .dot{width:34px;height:34px;border-radius:10px;border:2px solid #4a4155;background:var(--bg2);color:var(--muted);font:600 15px Fredoka,system-ui;display:grid;place-items:center;cursor:pointer}
  .dot.cur{border-color:var(--gold);color:var(--ink)}
  .dot.done{background:#3c5a3b;border-color:#5f8f5d;color:#e6ffe4}
  .title{display:flex;align-items:baseline;justify-content:space-between}
  .title{gap:10px}
  .title h2{margin:0;font-size:20px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .title .sub{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .cheese{font:600 14px Fredoka,system-ui;color:#3a2f22;background:linear-gradient(180deg,#ffe7a8,#f2c95b);border-radius:999px;padding:2px 9px}
  .cheese.bump{animation:cheeseBump .6s ease-out}
  @keyframes cheeseBump{40%{transform:scale(1.35)}}
  .tip{background:var(--bg2);border:1px solid #3d3548;border-radius:14px;padding:10px 12px;font-size:15px;color:#e8dfcf;line-height:1.35;min-height:62px;box-sizing:border-box}
  .chain{display:flex;align-items:center;justify-content:center;gap:2px;font-size:20px;background:rgba(255,255,255,.04);border-radius:12px;padding:6px 4px}
  .chain .arrow{font-size:11px;color:var(--muted);margin:0 1px}
  .chain .cap{font-size:11px;color:var(--muted);margin-right:6px;font-weight:500}
  .board-wrap{position:relative;align-self:center}
  .board{position:relative;border-radius:14px;box-shadow:0 14px 30px rgba(0,0,0,.45),0 0 0 2px #3a332c}
  .lvlbtn{font:600 15px Fredoka,system-ui;color:var(--ink);background:var(--bg2);border:2px solid #4a4155;border-radius:12px;padding:7px 12px;cursor:pointer}
  .card.pick{max-width:400px;padding:18px 16px}
  .card.pick h3{margin:0 0 2px}
  .card.pick .danger{margin-top:10px;background:transparent;box-shadow:none;border:2px solid #6b3a35;color:#f0a99c;font-size:15px;padding:10px}
  .card.pick .danger.armed{background:#6b3a35;color:#fff}
  .card.pick p{margin:0 0 12px;font-size:14px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:14px;max-height:56vh;overflow:auto}
  .grid .dot{width:auto;aspect-ratio:1;height:auto}
  .grid .dot.locked{cursor:default;background:#17131c;border-color:#2e2836;color:#8d8398;font-size:12px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1}
  .grid .dot.locked .lk{font-size:13px;opacity:.85}
  .card.pick .danger.hidden{display:none}
  /* Castle map: the levels are a winding road through the castle's rooms. */
  .card.pick{padding:16px 12px}
  .map{position:relative;max-height:64vh;overflow:auto;margin:0 -2px 12px;border-radius:16px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;background:#1b1720}
  .room{position:relative;background:var(--rb)}
  .room:first-child{border-radius:16px 16px 0 0}
  .room-head{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:8px;padding:8px 12px;
    background:linear-gradient(180deg,var(--stone-l),var(--stone) 60%,var(--stone-d));color:#2a2420;
    box-shadow:0 3px 0 rgba(0,0,0,.25);text-align:left}
  .room-head .ic{font-size:22px}
  .room-head b{font:600 16px Fredoka,system-ui;flex:1}
  .room-head small{font-size:12px;font-weight:600;opacity:.75}
  .room-head .devtest{font:600 12px Fredoka,system-ui;color:#fff;background:#6b3a35;border:0;border-radius:8px;padding:4px 8px;cursor:pointer}
  .room-body{position:relative;overflow:hidden}
  .room-body svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  /* stone walls down both sides, with torches in indoor rooms */
  .room .wall-side{position:absolute;top:0;bottom:0;width:9px;z-index:1;
    background:repeating-linear-gradient(180deg,var(--stone) 0 18px,var(--stone-d) 18px 20px);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .room .wall-side.l{left:0} .room .wall-side.r{right:0}
  .room .torch{position:absolute;z-index:2;font-size:13px;transform:translate(-50%,-50%);animation:flicker 1.4s ease-in-out infinite;pointer-events:none}
  .room .torch::after{content:"";position:absolute;left:50%;top:50%;width:46px;height:46px;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,190,90,.28),transparent 65%);border-radius:50%}
  /* the top of each room: arched windows indoors, scenery outdoors */
  .room .band{position:absolute;left:9px;right:9px;top:0;height:40px;display:flex;align-items:center;justify-content:space-around;font-size:22px}
  .room .window{width:22px;height:30px;border-radius:11px 11px 2px 2px;background:linear-gradient(180deg,#9cc3e6,#5b7fa8);
    border:3px solid var(--stone-d);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);position:relative}
  .room .window::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--stone-d);transform:translateX(-50%)}
  .room.night .window{background:linear-gradient(180deg,#273257,#141a33)}
  .room .deco{position:absolute;font-size:17px;opacity:.85;pointer-events:none;transform:translate(-50%,-50%)}
  .node{position:absolute;z-index:2;width:40px;height:40px;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;
    display:grid;place-items:center;font:600 15px Fredoka,system-ui;color:#3a2f22;
    background:radial-gradient(circle at 50% 35%,#fff7e4,#e2d3b2);border:3px solid #a8946f;box-shadow:0 3px 0 rgba(0,0,0,.35)}
  .node.done{background:radial-gradient(circle at 50% 35%,#ffe7a3,#e9b34a);border-color:#b77d14;color:#3d2a05}
  .node.done::after{content:"✓";position:absolute;right:-5px;bottom:-5px;width:17px;height:17px;border-radius:50%;
    background:#5f8f5d;color:#fff;font-size:11px;display:grid;place-items:center;border:2px solid #2a2533}
  .node.cur{border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,184,75,.45),0 3px 0 rgba(0,0,0,.35)}
  .node.locked{cursor:default;background:#2b2531;border-color:#4a4155;color:#8d8398;font-size:11px;box-shadow:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:1px}
  .node.locked .lk{font-size:11px;opacity:.8}
  /* boss levels: bigger, with a crown and a red rim */
  .node.boss{width:50px;height:50px;font-size:17px;border-color:#b8323a;box-shadow:0 0 0 3px rgba(184,50,58,.35),0 3px 0 rgba(0,0,0,.35)}
  .node.boss::before{content:"👑";position:absolute;top:-13px;right:-10px;font-size:17px;transform:rotate(18deg);filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
  .node.boss.locked{border-color:#7a3a40}
  .tip.boss{border-color:#b8323a;background:rgba(184,50,58,.15)}
  .tip.hinting{border-color:var(--gold);background:rgba(242,184,75,.12);color:var(--ink)}
  /* your mouse, standing on the current level; it walks the road to a newly opened level */
  .walker{position:absolute;z-index:3;font-size:22px;transform:translate(-50%,-150%);pointer-events:none;
    transition:left .26s ease-in-out,top .26s ease-in-out}
  .walker span{display:block;animation:bob 1.2s ease-in-out infinite}
  .walker.walking span{animation:hop .26s ease-in-out infinite}
  /* fog over rooms you haven't reached */
  .room.fog .room-body > :not(.fog-cover){filter:blur(3px) brightness(.4) saturate(.5)}
  .fog-cover{position:absolute;inset:0;z-index:3;display:grid;place-items:center;align-content:center;gap:4px;color:#e9e0d2;
    font-size:14px;font-weight:600;text-shadow:0 2px 4px rgba(0,0,0,.6);
    background:linear-gradient(180deg,rgba(40,36,48,.35),rgba(30,27,36,.75))}
  .fog-cover .cloud{position:absolute;font-size:54px;opacity:.5;animation:drift 9s ease-in-out infinite alternate}
  .room.soon .room-body{height:120px}
  .room-body > :not(.fog-cover){transition:filter 1.2s ease}
  .fog-cover{transition:opacity 1.2s ease}
  .room.lifted .fog-cover{opacity:0;pointer-events:none}
  .walker.fade{opacity:0;transition:left .5s ease-in-out,top .5s ease-in-out,opacity .3s .4s}
  .node.next{animation:nextGlow 1.1s ease-in-out infinite}
  @keyframes nextGlow{0%,100%{box-shadow:0 0 0 3px rgba(242,184,75,.4),0 3px 0 rgba(0,0,0,.35)}50%{box-shadow:0 0 0 9px rgba(242,184,75,.15),0 0 18px rgba(242,184,75,.8)}}
  /* the door at the end of each room */
  .doorway{position:relative;height:74px;display:flex;align-items:center;justify-content:center;gap:12px;
    background:repeating-linear-gradient(90deg,var(--stone) 0 34px,var(--stone-d) 34px 36px),var(--stone);
    box-shadow:inset 0 3px 0 rgba(255,255,255,.18),inset 0 -4px 0 rgba(0,0,0,.3)}
  .doorway .arch{position:relative;width:50px;height:60px;margin-top:14px;border-radius:25px 25px 0 0;
    background:radial-gradient(circle at 50% 70%,#ffe9a8,#f2b84b 45%,#8a5a12);box-shadow:0 0 0 4px var(--stone-d);perspective:160px}
  .doorway .leaf{position:absolute;inset:0;border-radius:25px 25px 0 0;transform-origin:left center;transition:transform 1.1s cubic-bezier(.3,1.3,.5,1);
    background:repeating-linear-gradient(90deg,#8b5a2b 0 11px,#6f4520 11px 12px);box-shadow:inset 0 0 0 2px #4d2f15;
    display:grid;place-items:center;font-size:16px}
  .doorway.open .leaf{transform:rotateY(-78deg)}
  .doorway.open .leaf .lock{display:none}
  .doorway .label{font:600 13px Fredoka,system-ui;color:#2a2420;max-width:120px;text-align:left;line-height:1.2}
  .doorway .spark{position:absolute;font-size:18px;pointer-events:none;animation:spark 1.2s ease-out forwards}
  /* The castle map: a full-height card with three views (the castle, an area's map, a room's road). */
  .card.pick{display:flex;flex-direction:column;box-sizing:border-box;width:calc(100vw - 48px);height:calc(100dvh - 48px);max-height:920px;max-width:460px}
  .card.pick .map{flex:1;min-height:0;max-height:none}
  .pick-head{display:flex;align-items:center;justify-content:center;gap:10px;min-height:36px}
  .pick-head h3{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Big buttons back to the whole castle and (in a room) to its floor */
  .pick-nav{display:flex;gap:8px;margin-bottom:8px}
  .pick-nav[hidden]{display:none}
  .pick-nav button{flex:1;min-width:0;height:46px;border-radius:12px;font:600 17px Fredoka,system-ui;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 10px}
  .nav-castle{color:#3a2f22;background:linear-gradient(180deg,#ffe7a8,#f2b84b);border:0;box-shadow:0 3px 0 #b77d14}
  .nav-castle:active{transform:translateY(2px);box-shadow:0 1px 0 #b77d14}
  .pick-back{color:var(--ink);background:var(--bg2);border:2px solid #4a4155}
  .castle-view-wrap{background:#1b2342}
  .castle-view{position:relative;min-height:100%;box-sizing:border-box;padding:118px 10px 12px;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#1b2342 0,#3b4a78 150px,#7a8fb8 300px,#7a8fb8 70%,#4d7a33 70%,#3d5a35 100%)}
  .castle-view .star{position:absolute;color:#fff;font-size:10px;animation:twinkle 2s infinite}
  .castle-view .flag{position:absolute;left:38%;top:84px;font-size:16px;transform-origin:left;animation:flagwave 2s ease-in-out infinite}
  .castle-view .tower{position:absolute;right:12px;top:32px;width:104px;height:96px;background:#5d564d;border-radius:4px;padding:6px;box-sizing:border-box}
  .castle-view .tower .roof{position:absolute;left:-4px;top:-24px;border-left:56px solid transparent;border-right:56px solid transparent;border-bottom:26px solid #7a3a40}
  .castle-view .tower .band-floor{flex-direction:column;gap:0;text-align:center;padding:4px;min-height:80px;justify-content:center}
  .castle-view .tower .band-floor small:not(.bf-count),.castle-view .tower .bf-text small{display:none}
  .castle-view .tower .band-floor b{font-size:12px;line-height:1.1}
  .keep{position:relative;display:flex;flex-direction:column;gap:6px;padding:10px 8px;border-radius:4px;background:repeating-linear-gradient(0deg,#6c6257 0 20px,#5d564d 20px 22px)}
  .keep .battlement{position:absolute;left:0;right:0;top:-14px;height:14px;background:repeating-linear-gradient(90deg,#6c6257 0 22px,transparent 22px 36px)}
  .cellars{padding:8px;background:#2a2420;border-radius:0 0 6px 6px}
  .moat-band{position:relative;height:18px;margin:8px -10px;background:#6fa3c4;animation:ripple 3s ease-in-out infinite}
  .moat-band .drawbridge{position:absolute;left:50%;top:-10px;width:46px;height:38px;transform:translateX(-50%);background:repeating-linear-gradient(0deg,#8a5a2b 0 6px,#6f4520 6px 8px)}
  .band-floor{position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:52px;box-sizing:border-box;padding:6px 10px;border:0;border-radius:6px;
    text-align:left;font-family:inherit;color:#3a2f22;cursor:pointer;background:linear-gradient(180deg,#fff3d6,#e9cf9a);box-shadow:inset 0 0 0 2px #b77d14}
  .band-floor.here{box-shadow:inset 0 0 0 3px var(--gold),0 0 18px rgba(242,184,75,.6)}
  .band-floor.locked{cursor:default;color:#7d7489;background:#2a2531;box-shadow:inset 0 0 0 2px #3a3342}
  .band-floor .bf-ic{font-size:22px} .band-floor.locked .bf-ic{opacity:.35}
  .bf-text{display:flex;flex-direction:column;flex:1;min-width:0}
  .bf-text b,.band-floor.locked b{font:600 15px Fredoka,system-ui}
  .bf-text small{font-size:10px;color:#6b5a40;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .band-floor.locked small{margin-left:auto;font-size:11px}
  .bf-count{font-size:11px;font-weight:700;color:#3b6d11}
  .band-floor .pr-mouse{position:absolute;right:48px;top:-12px;font-size:18px;animation:bob 1.2s ease-in-out infinite}
  .outside-band .band-floor{min-height:64px}
  .area-view{background:radial-gradient(circle at 50% 50%,#efdfba,#d4b882 75%,#a8854a)}
  .plan{position:relative;margin:14px 14px 8px;height:clamp(320px,calc(100dvh - 400px),560px)}
  .plan.floor{border-radius:6px;background:#e7d3a6;box-shadow:inset 0 0 0 8px #8a6a3a,inset 0 0 0 10px #6b4a24}
  .plan.floor .plan-room:first-of-type{}
  .plan.cellars .corridors polyline{stroke:#9c8660}
  .plan.floor.cellars{background:#cbb98f;box-shadow:inset 0 0 0 8px #5d564d,inset 0 0 0 10px #3f3a34}
  .plan.outside{border-radius:18px;background:radial-gradient(circle at 50% 60%,#d3e3a8,#b5cc86 80%)}
  .plan .castle-wall{position:absolute;left:0;right:0;top:0;height:9%;border-radius:12px 12px 0 0;background:repeating-linear-gradient(0deg,#9a9083 0 12px,#857b70 12px 14px)}
  .plan .moat{position:absolute;left:0;right:0;top:9%;height:5%;background:#6fa3c4;animation:ripple 3s ease-in-out infinite}
  .plan .corridors{position:absolute;inset:0;width:100%;height:100%}
  .corridors polyline{fill:none;stroke:#cdb486;stroke-width:12;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .plan.outside .corridors polyline{stroke:#c9b38a;stroke-width:16;stroke-linecap:round}
  .plan-room{position:absolute;box-sizing:border-box;padding:2px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    border:3px solid #6b4a24;border-radius:6px;background:#f6ead0;font-family:inherit;color:#3a2f22;cursor:pointer}
  .plan-room b{font:600 13px Fredoka,system-ui;line-height:1.1;text-align:center}
  .plan-room small{font-size:10px;font-weight:700;color:#8a5c10}
  .plan-room.done small{color:#3b6d11}
  .plan-room .pr-ic{font-size:20px}
  .plan-room.here{box-shadow:0 0 0 3px var(--gold),0 0 16px rgba(242,184,75,.8)}
  .plan-room .pr-mouse{position:absolute;right:4px;top:2px;font-size:16px;animation:bob 1.2s ease-in-out infinite;z-index:2}
  .plan-room .crown{position:absolute;left:4px;top:2px;font-size:14px;z-index:2}
  .plan-room.next{cursor:default;display:grid;place-items:center;text-align:center;border:3px dashed #6b4a24;background:#efe0bd;
    font:600 22px Fredoka,system-ui;color:#6b4a24;animation:pulse 1.8s ease-in-out infinite}
  .plan-room.next small{font-size:10px;line-height:1.1;color:#6b4a24}
  .plan-room.next.narrow small{writing-mode:vertical-rl;font-size:11px}
  .plan-room.far{cursor:default;border:2px solid rgba(107,74,36,.4);background:#e2cc9b}
  .plan.outside .plan-room.far{background:#a9c27a;border-radius:12px}
  .plan-room.place{justify-content:flex-end;padding:0 0 4px;border-radius:12px;background:#b5cc86}
  .plan-room.place .art{position:absolute;inset:0}
  .plan-room.place .pr-ic{display:none}
  .plan-room.place b,.plan-room.place small{position:relative;z-index:1;background:rgba(255,248,225,.88);padding:0 6px;border-radius:6px}
  .pa{position:absolute}
  .pa.sky{left:0;right:0;top:0;height:45%;background:linear-gradient(#a9d2ee,#d9eef7)}
  .pa.grass{left:0;right:0;bottom:0;height:55%;background:linear-gradient(#9cc46a,#7aa34c)}
  .pa.barn{left:10%;bottom:26%;width:42%;height:46%;background:#b0453a;clip-path:polygon(0 35%,50% 0,100% 35%,100% 100%,0 100%);box-shadow:inset 0 -10px 0 #8a3028}
  .pa.water{inset:0;background:repeating-linear-gradient(0deg,#6fa3c4 0 6px,#7fb2cf 6px 12px);animation:ripple 3s ease-in-out infinite}
  .pa.bridge{left:38%;top:0;bottom:0;width:24%;background:repeating-linear-gradient(0deg,#8a5a2b 0 6px,#6f4520 6px 8px)}
  .pa.gatehouse{left:16%;right:16%;bottom:0;top:22%;background:repeating-linear-gradient(0deg,#9a9083 0 10px,#857b70 10px 11px);
    clip-path:polygon(0 0,14% 0,14% 12%,28% 12%,28% 0,42% 0,42% 12%,58% 12%,58% 0,72% 0,72% 12%,86% 12%,86% 0,100% 0,100% 100%,62% 100%,62% 52%,50% 38%,38% 52%,38% 100%,0 100%)}
  .pe{position:absolute;font-size:16px;line-height:1}
  .pe.flutter{animation:flutter 3s ease-in-out infinite} .pe.drop{animation:drop 2.6s ease-in infinite}
  .pe.paddle{animation:paddle 5s ease-in-out infinite} .pe.wave{transform-origin:left;animation:flagwave 2s ease-in-out infinite}
  .stairs-row{display:flex;gap:10px;margin:0 14px 14px}
  .stairs{font:600 14px Fredoka,system-ui;padding:8px 12px;border-radius:10px;border:2px solid #6b4a24;background:#f6ead0;color:#3a2f22;cursor:pointer}
  .stairs.up{margin-left:auto} .stairs.locked{opacity:.65;cursor:default}

<!-- The physics: the Java engine, compiled to JavaScript by TeaVM. Defines scareSimulate(). -->
<script src="js/engine.js"></script>
<script>
Promise.all([
  fetch('levels.json').then(r => { if (!r.ok) throw new Error('levels.json: ' + r.status); return r.json(); }),
  fetch('legacy-holes.json').then(r => r.ok ? r.json() : []).catch(() => [])
]).then(([LEVELS, LEGACY]) => { (function(){
  const ORDER = ['mouse','cat','dog','bear','lion','elephant'];
  // All game physics happen in the Java engine; the page only draws and animates the frames it returns.
  const simulate = (level, placed) => JSON.parse(scareSimulate(JSON.stringify(level), JSON.stringify(placed)));
  const EMOJI = { mouse:'🐭', cat:'🐱', dog:'🐶', bear:'🐻', lion:'🦁', elephant:'🐘' };
  const NAME = { mouse:'mouse', cat:'cat', dog:'dog', bear:'bear', lion:'lion', elephant:'elephant' };
  const $ = id => document.getElementById(id);
  // Pull request previews live at /pr-preview/pr-N/ on the same site: keep their progress separate
  // so testing never marks levels solved in the real game.
  const PREVIEW = /\/pr-preview\/pr-(\d+)\//.exec(location.pathname);
  const KEY = PREVIEW ? `preview${PREVIEW[1]}_` : '';
  const store = { get(k,d){ try{ const v=localStorage.getItem(KEY+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
                  set(k,v){ try{ localStorage.setItem(KEY+k,JSON.stringify(v)); }catch(e){} } };

  // Sound: small effects made on the fly with the Web Audio API (no sound files). On by default; the
  // speaker button mutes it, and the choice is remembered for this browser (all previews too).
  const Sound = (() => {
    let ctx = null, on = true;
    try { on = localStorage.getItem('sam_sound') !== 'off'; } catch(e) {}
    const audio = () => {
      if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    };
    // one note: frequency (slides to `to`), length in seconds, wave shape, volume, start delay
    const note = (f, len, type='sine', vol=0.12, delay=0, to=null) => {
      if (!on) return; const a = audio(); if (!a) return;
      const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + len);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      o.connect(g).connect(a.destination); o.start(t); o.stop(t + len + 0.02);
    };
    // each animal's "eek!" when it gets scared: small animals high, big ones low
    const VOICE = { mouse:[1500,1900,'sine'], cat:[880,1100,'triangle'], dog:[520,420,'square'], bear:[200,160,'sawtooth'],
                    lion:[260,180,'sawtooth'], elephant:[330,520,'square'] };
    return {
      get on(){ return on; },
      toggle(){ on = !on; try { localStorage.setItem('sam_sound', on ? 'on' : 'off'); } catch(e) {} if (on) this.place(); return on; },
      unlock(){ audio(); },
      place(){ note(660, 0.07, 'triangle', 0.10); note(990, 0.06, 'triangle', 0.06, 0.04); },
      lift(){ note(520, 0.06, 'triangle', 0.08, 0, 380); },
      go(){ note(330, 0.18, 'triangle', 0.08, 0, 660); },
      scared(t){ const v = VOICE[t] || VOICE.cat; note(v[0], 0.12, v[2], t==='bear'||t==='lion'||t==='elephant' ? 0.06 : 0.08, 0, v[1]); },
      bump(){ note(140, 0.12, 'square', 0.07, 0, 90); },

      if (roomReached(r)) {
        const n = rm.end - rm.start, s = solvedIn(r), done = roomCleared(r), here = r === mouseRoom;
        const fresh = !seenRooms.includes(r) ? ' reveal' : '';
        const lift = fresh ? '<span class="fog lift"></span>' : '';  // the fog clears off a room you just reached
        const boss = rm.end === areaEnd(a) ? '<span class="crown">👑</span>' : '';
        blocks += `<button class="plan-room${outside?' place':''}${done?' done':''}${here?' here':''}${fresh}" data-r="${r}" style="${pos}">
          ${outside ? `<span class="art">${PLACE_ART[rm.name]||''}</span>` : ''}
          <span class="pr-ic">${rm.ic}</span><b>${rm.name}</b><small>${done ? '✓ ' : ''}${s}/${n}</small>${boss}
          ${here ? '<span class="pr-mouse">🐭</span>' : ''}${lift}</button>`;
      } else if (r === firstMissing) {
        blocks += `<div class="plan-room next fogged${w < 20 ? ' narrow' : ''}" style="${pos}"><span class="fog"></span><span class="fog-q">${roomExists(r) ? '?' : `<small>coming${w < 20 ? ' ' : '<br>'}soon</small>`}</span></div>`;
      } else {
        blocks += `<div class="plan-room far fogged" style="${pos}"><span class="fog"></span></div>`;
      }
    });
    const up = AREAS[a+1] && roomsOf(a+1).length ? a+1 : null, down = a > 0 ? a-1 : null;
    const stairs = `${down!==null ? `<button class="stairs down" data-a="${down}">${outside ? '' : (a===1 ? '⬇ Outside' : `⬇ ${AREAS[down].name}`)}</button>` : ''}
      ${up!==null ? `<button class="stairs up${areaReached(up)?'':' locked'}" data-a="${up}" ${areaReached(up)?'':'disabled'}>${areaReached(up) ? `⬆ ${outside ? 'Into the castle' : AREAS[up].name}` : (outside ? '🔒 Into the castle' : '🔒 Upstairs')}</button>` : ''}`;
    return `<div class="plan ${outside ? 'outside' : 'floor'}${AREAS[a].kind === 'cellars' ? ' cellars' : ''}">
      ${outside ? '<span class="castle-wall"></span><span class="moat"></span>' : ''}
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" class="corridors">${corridors}</svg>
      ${blocks}</div><div class="stairs-row">${stairs}</div>`;
  }

  // The whole castle, side on: the Outside in front, floors stacked inside, cellars below.
  function castleMap() {
    const band = (a, cls='') => {
      const A = AREAS[a], rs = roomsOf(a);
      if (!rs.length) return '';
      const reached = areaReached(a), done = areaCleared(a), here = mouseRoom !== null && room(mouseRoom).area === a;
      const prevReached = a === 0 || areaReached(a-1);
      const fresh = reached && !seenAreas.includes(a) ? ' reveal' : '';
      // Floors you haven't reached are under fog: you can see there's a floor, not what's on it.
      if (!reached) return `<div class="band-floor locked fogged ${cls}${prevReached && roomExists(rs[0]) ? ' next' : ''}"><span class="fog"></span>
        <b>🔒</b><small>${roomExists(rs[0]) ? `${rs.length} room${rs.length > 1 ? 's' : ''}` : 'coming soon'}</small></div>`;
      return `<button class="band-floor ${cls}${done?' done':''}${here?' here':''}${fresh}" data-a="${a}"><span class="bf-ic">${A.ic}</span>
        <span class="bf-text"><b>${A.name}</b><small>${rs.map(r => roomReached(r) ? room(r).name : '?').join(' · ')}</small></span>
        <small class="bf-count">${done ? '✓' : `${areaSolved(a)}/${areaSize(a)}`}</small>${here?'<span class="pr-mouse">🐭</span>':''}${fresh ? '<span class="fog lift"></span>' : ''}</button>`;
    };
    const order = [7,6,5,4,3,2];  // floors inside the keep, top to bottom
    return `<div class="castle-view">
      <span class="star" style="left:14%;top:4%">✦</span><span class="star" style="left:46%;top:7%;animation-delay:.8s">✦</span>
      <div class="tower"><div class="roof"></div>${band(8,'tower-band')}</div>
      <span class="flag">🚩</span>
      <div class="keep"><div class="battlement"></div>${order.map(a=>band(a)).join('')}</div>
      <div class="cellars">${band(1)}</div>
      <div class="moat-band"><span class="drawbridge"></span></div>
      <div class="outside-band">${band(0)}</div>
    </div>`;
  }

  // One room's road (levels zigzag across in rows of five; the road loops out at each row's end).
  function roomRoad(r) {
    const COLS = 5, ROW = 78, TOP = 86;
    const colOf = k => { const row=Math.floor(k/COLS), c=k%COLS; return row%2 ? COLS-1-c : c; };
    const xOf = k => 14 + colOf(k) * 18;
    const yOf = k => TOP + Math.floor(k/COLS)*ROW + Math.round(Math.sin(colOf(k)*1.7 + Math.floor(k/COLS)) * 9);
    const road = pts => { let d=`M ${pts[0][0]} ${pts[0][1]}`;
      for (let i=0;i<pts.length-1;i++){ const a=pts[i-1]||pts[i], b=pts[i], c=pts[i+1], e=pts[i+2]||c;
        d += ` C ${b[0]+(c[0]-a[0])/6} ${b[1]+(c[1]-a[1])/6}, ${c[0]-(e[0]-b[0])/6} ${c[1]-(e[1]-b[1])/6}, ${c[0]} ${c[1]}`; }
      return d; };
    const rm = room(r), from = rm.start, to = Math.min(LEVELS.length, rm.end);
    const band = rm.out ? rm.top.map(e=>`<span>${e}</span>`).join('')
      : `<span class="window"></span><span>${rm.top[0]}</span><span>${rm.top[1]}</span><span>${rm.top[2]}</span><span class="window"></span>`;
    const n = to-from, rows = Math.ceil(n/COLS), h = TOP + (rows-1)*ROW + 52;
    const pts = [];
    for (let k=0;k<n;k++) {
      pts.push([xOf(k), yOf(k)]);
      if (k%COLS===COLS-1 && k<n-1) pts.push([Math.floor(k/COLS)%2 ? 4 : 96, (yOf(k)+yOf(k+1))/2]);
    }
    let nodes = '';
    for (let k=0;k<n;k++) {
      const i = from+k, pos = `left:${xOf(k)}%;top:${yOf(k)}px`, boss = isBoss(i) ? ' boss' : '';
      nodes += isOpen(i)
        ? `<div class="node${boss} ${i===li?'cur':''} ${isDone(i)?'done':''}" data-i="${i}" style="${pos}">${i+1}</div>`
        : `<div class="node locked${boss}" data-i="${i}" title="Locked" style="${pos}"><span class="lk">🔒</span><span>${i+1}</span></div>`;
    }
    if (li >= from && li < to) { const k=li-from; nodes += `<div class="walker" style="left:${xOf(k)}%;top:${yOf(k)}px"><span>🐭</span></div>`; }
    let deco = '';
    for (let row=0; row<rows-1; row++) {
      const y = TOP + row*ROW + ROW/2, e1 = rm.deco[(row*2) % rm.deco.length], e2 = rm.deco[(row*2+1) % rm.deco.length];
      deco += `<span class="deco" style="left:${row%2?90:10}%;top:${y}px">${e1}</span><span class="deco" style="left:${row%2?34:66}%;top:${y}px">${e2}</span>`;
    }
    let torches = '';
    if (!rm.out) for (let y=TOP+ROW/2; y<h-20; y+=ROW*2) torches += `<span class="torch" style="left:6px;top:${y}px">🔥</span><span class="torch" style="right:-7px;top:${y+ROW}px">🔥</span>`;
    const d = road(pts);
    let html = `<section class="room ${rm.night?'night':''}" data-room="${r}" style="--rb:${rm.bg}">
      <div class="room-head"><span class="ic">${rm.ic}</span><b>${rm.name}</b><small>${LEVELS[from].w}×${LEVELS[from].h} · ${solvedIn(r)}/${rm.end-rm.start}</small>
        ${DEV && rm.end <= LEVELS.length ? `<button class="devtest" data-r="${r}">Test</button>` : ''}</div>
      <div class="room-body" style="height:${h}px">
        <div class="band">${band}</div>
        <svg viewBox="0 0 100 ${h}" preserveAspectRatio="none">
          <path d="${d}" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="30" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
          <path d="${d}" fill="none" stroke="#b9ab92" stroke-width="24" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
          <path d="${d}" fill="none" stroke="#d8ccb2" stroke-width="3" stroke-dasharray="6 10" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
        <div class="wall-side l"></div><div class="wall-side r"></div>${torches}${deco}${nodes}
      </div>`;
    // The door out of this room: it opens once every level in the room is solved.
    if (rm.end <= LEVELS.length) {
      const next = room(r+1), cleared = roomCleared(r), seen = doorsSeen.includes(r);
      const label = cleared ? `To the ${next.name}` : `Solve all ${rm.end-rm.start} levels to open the door`;
      html += `<div class="doorway ${cleared && seen ? 'open' : ''} ${cleared && !seen ? 'to-open' : ''}" data-r="${r}">
        <div class="arch"><div class="leaf"><span class="lock">${cleared ? '' : '🔒'}</span></div></div>
        <div class="label">${label}</div></div>`;
    } else {
      html += `<div class="doorway soon"><div class="label">More levels coming soon</div></div>`;
    }
    return html + `</section>`;
  }

  function renderDots(){
    if (mouseRoom === null) mouseRoom = roomIndexOf(li);
    const m = $('dots');
    let title, back = null;
    if (view.kind === 'room') {
      const rm = room(view.r);
      title = rm.name; back = { kind:'area', a: rm.area, label: AREAS[rm.area].name };
      m.className = 'map room-view'; m.innerHTML = roomRoad(view.r);
    } else if (view.kind === 'area') {
      title = AREAS[view.a].name; back = { kind:'castle', label: 'Castle' };
      m.className = 'map area-view'; m.innerHTML = areaMap(view.a);
    } else {
      title = 'The castle';
      m.className = 'map castle-view-wrap'; m.innerHTML = castleMap();
    }
    // Start at the top; the castle scrolls to where the mouse is (or to a floor that just opened)
    m.scrollTop = 0;
    if (view.kind === 'castle') centerOn('.band-floor.reveal') || centerOn('.band-floor.here');
    $('pickTitle').textContent = title;
    // Castle button on every map but the castle; in a room, a second button back to its floor
    $('pickNav').hidden = view.kind === 'castle';
    $('howToWrap').hidden = view.kind !== 'castle';
    $('pickCastle').onclick = () => { view = { kind:'castle' }; renderDots(); };
    $('pickBack').hidden = !back || back.kind === 'castle';
    if (back) { $('pickBack').textContent = `‹ ${back.label}`; $('pickBack').onclick = () => { view = back; renderDots(); }; }
    // taps: areas open their map, rooms their road, levels load
    m.querySelectorAll('.band-floor[data-a], .stairs[data-a]:not([disabled])').forEach(b => b.onclick = () => { view = { kind:'area', a: +b.dataset.a }; renderDots(); });
    m.querySelectorAll('.plan-room[data-r]').forEach(b => b.onclick = () => { view = { kind:'room', r: +b.dataset.r }; renderDots(); centerOn('.node.cur') || (m.scrollTop = 0); });
    m.querySelectorAll('.node:not(.locked)').forEach(d=>d.onclick=()=>{ $('picker').classList.remove('show'); load(+d.dataset.i); });
    // Developer mode: solve every level in a room but the last, and go to the last one, to try clearing it.
    m.querySelectorAll('.devtest').forEach(btn => btn.onclick = () => {
      const r = +btn.dataset.r, rm = room(r);
      for (let i = rm.start; i < rm.end - 1; i++) solved[levelKey(LEVELS[i])] = LEVELS[i].solution.map(p=>({...p}));
      delete solved[levelKey(LEVELS[rm.end-1])]; store.set('cm_solved', solved);
      doorsSeen = doorsSeen.filter(x => x !== r); store.set('cm_doors2', doorsSeen);
      $('picker').classList.remove('show'); load(rm.end - 1);
      toast(`Developer: the ${rm.name} is solved except level ${rm.end}. Solve it to clear the room.`);
    });
    if (view.kind !== 'room') setTimeout(markSeen, 1200);  // play each room's and area's flourish once
    $('progress').textContent = `${doneCount()} of ${LEVELS.length} solved` + (DEV ? ' · developer mode' : '');
    $('resetProgress').classList.toggle('hidden', !DEV);
    $('lvlBtn').textContent = `Level ${li+1} ▾`;
  }
  // Scrolls the map so the first element matching sel is in the middle; false if there is none.
  function centerOn(sel){
    const m = $('dots'), el = m.querySelector(sel); if (!el) return false;
    let y=0; for (let e=el; e && e!==m; e=e.offsetParent) y+=e.offsetTop;
    m.style.scrollBehavior='auto'; m.scrollTop = y - m.clientHeight/2; m.style.scrollBehavior=''; return true;
  }

  // How-to-play cards. INTRO runs before level 1 (and from "How to play" in the level picker);
  // NEW_CARDS show once, the first time you open the level where something new appears.
  const scares = (a, b) => `<span>${a}</span><i>scares</i><span>${b}</span>`;
  const INTRO = [
    { art: '<span>🐭</span><i>➜</i><span>🕳️</span>', title: 'Help the mouse escape!',
      text: 'Scare the mouse so it runs into the hole.' },
    { art: `<div class="g-row">${scares('🐱','🐭')}</div><div class="g-row">${scares('🐶','🐱')}</div><div class="g-row">${scares('🐻','🐶')}</div>`,
      title: 'Animals scare each other',
      text: 'Each animal scares just one other. A scared animal runs straight away, and it can scare the next animal on its way.' },
    { art: '<span>👆</span><span>🐱</span><i>➜</i><span class="g-sq"></span><i>then</i><span class="g-go">▶ Go</span>', title: 'Set up a chain reaction',
      text: 'Tap an animal in your hand, then tap a square to place it. When you\'re ready, press Go and watch!' },
    { art: '<span>🧱</span><span>🥶</span>', title: 'Good to know',
      text: 'Running animals stop at walls and at the edge of the board. An animal touching two animals it fears freezes until one of them moves away.' },
  ];
  const NEW_CARDS = {
    12: { art: scares('🦁','🐻'), title: 'New animal: the lion!', text: 'Lions scare bears.' },
    32: { art: `<div class="g-row">${scares('🐘','🦁')}</div><div class="g-row">${scares('🐭','🐘')}</div>`, title: 'New animal: the elephant!',
          text: 'Elephants scare lions. And elephants are scared of mice!' },
    170: { art: '<span class="g-counter"></span><span class="g-counter"></span>', title: 'New: kitchen counters!',
           text: 'Animals can\'t run through counters. A running animal stops when it reaches one.' },
    204: { art: '<span class="g-shelf"></span><span class="g-shelf"></span>', title: 'New: bookshelves!',
           text: 'Like the counters, animals can\'t run through bookshelves.' },
    262: { art: '<span class="g-table"></span><span class="g-table"></span>', title: 'New: banquet tables!',
           text: 'Animals can\'t run through the tables. A running animal stops when it reaches one.' },
    292: { art: '<span class="g-pillar"></span><span class="g-pillar"></span>', title: 'New: marble pillars!',
           text: 'Animals can\'t run through the pillars either.' },
    322: { art: '<span class="g-statue"></span><span class="g-statue"></span>', title: 'New: statues!',
           text: 'Animals can\'t run through the statues. Mind the art!' },
  };
  let cardsSeen = store.get('cm_cards', []);
  function showGuide(cards, done) {
    let k = 0;
    const close = () => { $('guide').classList.remove('show'); if (done) done(); };
    const draw = () => {
      const c = cards[k];
      $('guideArt').innerHTML = c.art; $('guideTitle').textContent = c.title; $('guideText').textContent = c.text;
      $('guideDots').innerHTML = cards.length > 1 ? cards.map((_, j) => `<b class="${j === k ? 'on' : ''}"></b>`).join('') : '';
      $('guideNext').textContent = k < cards.length - 1 ? 'Next' : (cards === INTRO ? "Let's play!" : 'Got it');
      $('guideSkip').hidden = cards.length < 2 || k === cards.length - 1;
    };
    $('guideNext').onclick = () => { if (k < cards.length - 1) { k++; draw(); } else close(); };
    $('guideSkip').onclick = close;
    draw(); $('guide').classList.add('show');
  }
  function showNewCard(i) {
    if (!NEW_CARDS[i] || cardsSeen.includes(i)) return;
    cardsSeen = [...cardsSeen, i]; store.set('cm_cards', cardsSeen);
    showGuide([NEW_CARDS[i]]);
  }

  function load(i){
    if(!isOpen(i)) i=unlockedUpTo();
    clearTimeout(timer); clearTimeout(backTimer);
    li=i; store.set('cm_level',li); L=LEVELS[li];
    const saved = solved[levelKey(L)];
    placed = Array.isArray(saved) ? saved.map(p=>({...p})) : []; selected=0; mode='edit'; hintPlan=null; hintStep=hintsUsed[levelKey(L)]||0; hintShown=hintStep>0;
    $('lvlName').textContent = L.name;
    const boss = isBoss(li);
    $('lvlSub').textContent = (boss ? '👑 Boss · ' : '') + (isDone(li) ? `Level ${li+1} · solved ✓` : `Level ${li+1}`);
    const areaName = AREAS[areaOf(li)].name;
    $('tip').textContent = L.tip || (boss ? `Boss level: the toughest puzzle ${areaName === 'Outside' ? 'outside the castle' : (areaName === 'Cellars' ? 'in the cellars' : 'on the ' + areaName.toLowerCase())}.`
      : L.inv.length>1 ? `Place your ${L.inv.length} animals, then press Go.` : 'Get the mouse into the hole.');
    $('tip').classList.toggle('boss', boss); $('tip').classList.remove('hinting');
    if (hintStep) { const t = hintText(plan()[Math.min(hintStep, plan().length) - 1]); $('tip').textContent = `💡 ${t[0].toUpperCase()}${t.slice(1)}`; $('tip').classList.add('hinting'); }
    showCheese();
    renderDots(); buildBoard(); renderTray(); renderAnimals(); updateButtons();
    showNewCard(li);
  }

  function buildBoard(){
    const b=$('board'); const W=L.w+2, H=L.h+2;
    const maxW = Math.min(window.innerWidth - 28, 492);
    const maxH = window.innerHeight * 0.52;
    const ef = (L.w>7||L.h>7) ? 0.3 : 1;
    cell = Math.floor(Math.min(maxW/(L.w+2*ef), maxH/(L.h+2*ef)));
    edge = Math.round(cell*ef);
    b.style.width=(cell*L.w+2*edge)+'px'; b.style.height=(cell*L.h+2*edge)+'px';
    // dress the board for the room this level is in
    const theme = BOARDS[room(roomIndexOf(li)).name];
    ['--floor-a','--floor-b','--stone-l','--stone','--stone-d'].forEach((v,k)=> theme ? b.style.setProperty(v, theme[k]) : b.style.removeProperty(v));
    boardTheme = theme && theme[5] ? ` walls-${theme[5]}` : '';
    b.className='board edit armed' + boardTheme;
    const walls=new Set(L.walls.map(w=>w.join(',')));
    let html='';
    for(let y=-1;y<=L.h;y++) for(let x=-1;x<=L.w;x++){
      const side = (v,n) => v<0||v>=n;
      const pos=`left:${x<0?0:P(x)}px;top:${y<0?0:P(y)}px;width:${side(x,L.w)?edge:cell}px;height:${side(y,L.h)?edge:cell}px`;
      const border = x<0||y<0||x>=L.w||y>=L.h;
      if(x===L.hole[0]&&y===L.hole[1]){
        const side = border ? (y<0?'t':y>=L.h?'b':x<0?'l':'r') : `in ${(x+y)%2?'alt':''}`;
        html+=`<div class="tile hole ${side}" style="${pos}"><i></i></div>`;
      } else if(border) html+=`<div class="tile border" style="${pos}"></div>`;
      else if(walls.has(x+','+y)) html+=`<div class="tile floor ${(x+y)%2?'alt':''}" style="${pos}"><div class="tile wall" style="left:4%;top:4%;width:92%;height:92%;position:absolute"></div></div>`;
      else html+=`<div class="tile floor placeable ${(x+y)%2?'alt':''}" data-x="${x}" data-y="${y}" style="${pos}"></div>`;
    }
    b.innerHTML=html;
    b.querySelectorAll('.placeable').forEach(t=>t.onclick=()=>tapCell(+t.dataset.x,+t.dataset.y));
  }

  function occupied(x,y){ return L.fixed.some(a=>a.x===x&&a.y===y) || placed.some(a=>a.x===x&&a.y===y); }
  function remaining(){ const inv=[...L.inv]; placed.forEach(p=>{ const k=inv.indexOf(p.t); if(k>=0) inv.splice(k,1); }); return inv; }

  function tapCell(x,y){
    if(mode==='failed') backToStart();
    if(mode!=='edit') return;
    if(occupied(x,y)) return;
    const rem=remaining();
    if(!rem.length){ toast('All your animals are placed. Tap one to pick it up.'); return; }
    const want = revealedSquares().find(s=>s.x===x&&s.y===y);
    const t = want && rem.includes(want.t) ? want.t : rem[Math.min(selected, rem.length-1)];
    placed.push({t,x,y}); selected=0; Sound.place();
    renderTray(); renderAnimals(); updateButtons();
  }

  function renderTray(){
    const rem=remaining(); const tr=$('tray');
    if(!L.inv.length){ tr.innerHTML='<span class="empty">No animals to place.</span>'; return; }
    tr.innerHTML = '<div class="lbl">Your animals</div>' + rem.map((t,i)=>`<div class="piece ${i===selected?'sel':''}" data-i="${i}">${EMOJI[t]}</div>`).join('')
      + placed.map(p=>`<div class="piece used">${EMOJI[p.t]}</div>`).join('');
    tr.querySelectorAll('.piece:not(.used)').forEach(p=>p.onpointerdown=e=>startDrag(e,{t:rem[+p.dataset.i], tray:+p.dataset.i}));
    $('board').classList.toggle('armed', mode==='edit' && rem.length>0);
  }

  function renderAnimals(frame){
    const b=$('board'); b.querySelectorAll('.animal').forEach(e=>e.remove()); animalEls={};
    const list = frame || [...L.fixed.map(a=>({...a})), ...placed.map(a=>({...a, placed:true}))];
    list.forEach((a,i)=>{
      const el=document.createElement('div');
      el.className='animal'+(a.placed&&mode==='edit'?' placed':'');
      el.style.width=el.style.height=cell+'px';
      el.style.transform=`translate(${P(a.x)}px,${P(a.y)}px)`;
      el.innerHTML=`<span style="font-size:${Math.round(cell*0.68)}px">${EMOJI[a.t]}</span>`;
      if(a.placed&&mode==='edit'){ const pi=placed.findIndex(p=>p.x===a.x&&p.y===a.y); el.onpointerdown=e=>startDrag(e,{t:a.t, placedIdx:pi, el}); }
      b.appendChild(el); animalEls[a.id!=null?a.id:i]=el;
    });
    drawHints();
  }

  function updateButtons(){
    $('goBtn').disabled = mode==='running' || mode==='replay';
    const n = plan().length;
    $('hintBtn').disabled = mode!=='edit' || hintStep>=n;
    $('hintBtn').textContent = hintStep<n ? `Hint · ${HINT_COST[plan()[hintStep].kind]}🧀` : 'Hint';
    $('resetBtn').disabled = mode==='running' || mode==='replay' || (mode==='edit' && !placed.length);
    $('goBtn').textContent = mode==='running' ? 'Running…' : 'Go!';
  }

  // Shows step f of a run (moving every animal from where it was at step f-1). The animals glide for
  // `glide` ms, which matches the time between steps.
  function showStep(res, f, glide){
    $('board').style.setProperty('--glide', `${Math.round(glide)}ms`);
    const prev=res.frames[f-1], cur=res.frames[f];
    const stuckNow=new Set((res.bumps||[])[f]||[]), stuckBefore=new Set((res.bumps||[])[f-1]||[]);
    let voice=null, bumped=false;
    cur.forEach(a=>{
      const el=animalEls[a.id]; const p=prev[a.id];
      el.style.transform=`translate(${P(a.x)}px,${P(a.y)}px)`;
      const startedMoving = (p.x!==a.x||p.y!==a.y) && (f===1 || (res.frames[f-2][a.id].x===p.x && res.frames[f-2][a.id].y===p.y));
      if(startedMoving){ el.classList.remove('scared'); void el.offsetWidth; el.classList.add('scared'); voice = a.t; }
      el.classList.toggle('stuck', stuckNow.has(a.id));
      if(stuckNow.has(a.id) && !stuckBefore.has(a.id)){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); bumped=true; }
      if(a.gone) setTimeout(()=>el.classList.add('gone'),140);
    });
    if(voice) Sound.scared(voice);
    if(bumped) Sound.bump();
  }
  const showStart = res => renderAnimals(res.frames[0].map(a=>({...a, placed: a.id>=L.fixed.length})));

  // Plays a whole run, then calls done.
  function animate(res, stepMs, done){
    showStart(res);
    let f=1;
    const tick=()=>{
      if(f>=res.frames.length){ timer=null; done(); return; }
      showStep(res, f++, stepMs()*0.9);
      timer=setTimeout(tick, stepMs());
    };
    timer=setTimeout(tick, stepMs());
  }

  let lastRun = null;   // the winning run, for the instant replay
  function go(){
    if(mode==='running' || mode==='won' || mode==='replay') return;
    clearTimeout(backTimer);
    clearHint();
    mode='running'; updateButtons(); renderTray();
    $('board').className='board running' + boardTheme;
    Sound.go();
    const res = simulate(L, placed);
    lastRun = res;
    animate(res, ()=>170, ()=>finish(res));
  }

  // Instant replay: a replay screen with play/pause and 1x or half speed at the bottom. It opens paused at
  // the start, at half speed.
  const rp = { f: 1, playing: false, slow: true };
  const rpStep = () => rp.slow ? 340 : 170;
  function rpShow(){
    $('playBtn').textContent = rp.playing ? '⏸ Pause' : rp.f >= lastRun.frames.length ? '↺ Again' : '▶ Play';
    $('speed1').classList.toggle('on', !rp.slow); $('speedHalf').classList.toggle('on', rp.slow);
  }
  function rpTick(){
    if(rp.f >= lastRun.frames.length){ rp.playing=false; rpShow(); return; }
    showStep(lastRun, rp.f++, rpStep()*0.9);
    timer=setTimeout(rpTick, rpStep());
  }
  function rpPlay(){
    if(rp.playing){ rp.playing=false; clearTimeout(timer); rpShow(); return; }
    if(rp.f >= lastRun.frames.length){ rp.f=1; showStart(lastRun); }
    rp.playing=true; rpShow(); timer=setTimeout(rpTick, 120);
  }
  function replay(){
    if(!lastRun || mode!=='won') return;
    clearTimeout(timer);
    $('win').classList.remove('show');
    mode='replay';
    document.body.classList.add('replaying');
    $('board').className='board running' + boardTheme;
    rp.f=1; rp.playing=false; rp.slow=true;
    showStart(lastRun); rpShow();
  }
  function endReplay(){
    if(mode!=='replay') return;
    clearTimeout(timer); rp.playing=false;
    document.body.classList.remove('replaying');
    // back on the last step of the run, then the win card again
    renderAnimals(lastRun.frames[lastRun.frames.length-1].map(a=>({...a, placed: a.id>=L.fixed.length})));
    mode='won'; updateButtons();
    $('win').classList.add('show');
  }

  let clearedRoom;   // set when the last win cleared a room: the map then plays the door opening
  function confetti(){
    const card = $('win').querySelector('.card');
    for (let k=0;k<26;k++){ const c=document.createElement('span'); c.className='confetti';
      c.textContent=['🎉','✨','🧀','⭐','🎊'][k%5]; c.style.left=`${Math.random()*100}%`;
      c.style.animationDelay=`${300+Math.random()*700}ms`; card.appendChild(c); setTimeout(()=>c.remove(),3000); }
  }

  function finish(res){
    if(res.win){
      mode='won';
      const rIdx = roomIndexOf(li), wasCleared = roomCleared(rIdx), first = !isDone(li);
      solved[levelKey(L)] = placed.map(p=>({t:p.t,x:p.x,y:p.y})); store.set('cm_solved',solved);
      renderDots();
      const last = li===LEVELS.length-1, cleared = !wasCleared && roomCleared(rIdx);
      // Cheese for a first solve: 3 with no hints, 1 with; bosses double; +5 for clearing a room.
      const forLevel = first ? (hintShown ? 1 : 3) * (isBoss(li) ? 2 : 1) : 0, earned = forLevel + (cleared ? 5 : 0);
      if (earned) setTimeout(() => addCheese(earned), 600);
      const cheeseLine = !first ? '' : ` +${earned} 🧀` + (cleared ? ` (${forLevel} + 5 for the room)` : hintShown ? ` (${isBoss(li) ? 6 : 3} without hints)` : '');
      $('winBig').textContent = cleared ? (isBoss(li) ? '👑🚪✨' : '🚪✨') : isBoss(li) ? '👑🐭' : '🐭🕳️';
      clearedRoom = cleared ? rIdx : undefined;
      $('nextBtn').style.display = cleared ? 'none' : '';
      $('winLevelsBtn').textContent = cleared ? 'Open the door 🚪' : 'All levels';
      $('winLevelsBtn').classList.toggle('go', cleared);
      if (cleared) {
        const next = room(rIdx+1);
        $('winTitle').textContent = isBoss(li) ? `Boss beaten! ${room(rIdx).name} cleared!` : `${room(rIdx).name} cleared!`;
        $('winText').textContent = `The door to the ${next.name} is open.` + cheeseLine + (last ? ' More puzzles are on the way.' : '');
        confetti(); Sound.cheer();
      } else {
        Sound.win();
        $('winTitle').textContent = last ? 'Castle cleared!' : isBoss(li) ? 'Boss beaten!' : 'Mouse escaped!';
        $('winText').textContent = (last ? 'You finished every level. More puzzles are on the way.' : `Level ${li+1} solved.`) + cheeseLine;
      }
      $('nextBtn').textContent = last ? 'Play again' : 'Next level';
      setTimeout(()=>$('win').classList.add('show'), 350);
    } else {
      mode='failed'; Sound.fail();
      const last=(res.bumps||[])[res.frames.length-1]||[];
      toast(res.loop ? 'The animals are stuck going back and forth.'
          : last.length ? 'Stuck! Two animals tried to move into the same square.'
          : 'The mouse is still in the castle.');
      backTimer=setTimeout(()=>{ if(mode==='failed') backToStart(); }, last.length ? 2600 : 1400);
    }
    updateButtons();
  }

  function backToStart(){
    clearTimeout(timer); clearTimeout(backTimer);
    mode='edit'; $('board').className='board edit' + boardTheme;
    renderTray(); renderAnimals(); updateButtons();
  }
  function reset(){ placed=[]; selected=0; clearHint(); backToStart(); }

  // Drag and drop (tap still works: tap a tray animal to select it, tap a placed animal to send it back).
  let drag=null;
  function startDrag(e,info){
    if(mode==='failed') backToStart();
    if(mode!=='edit') return;
    e.preventDefault();
    drag={...info, sx:e.clientX, sy:e.clientY, moved:false, ghost:null, target:null};
    document.addEventListener('pointermove',moveDrag,{passive:false});
    document.addEventListener('pointerup',endDrag);
    document.addEventListener('pointercancel',cancelDrag);
  }
  function cellAt(cx,cy){
    const r=$('board').getBoundingClientRect();
    const x=Math.floor((cx-r.left-edge)/cell), y=Math.floor((cy-r.top-edge)/cell);
    if(x<0||y<0||x>=L.w||y>=L.h) return null;
    return {x,y};
  }
  function canDrop(c){
    if(!c) return false;
    if(L.walls.some(w=>w[0]===c.x&&w[1]===c.y)) return false;
    if(c.x===L.hole[0]&&c.y===L.hole[1]) return false;
    if(L.fixed.some(a=>a.x===c.x&&a.y===c.y)) return false;
    return !placed.some((p,i)=>p.x===c.x&&p.y===c.y&&i!==drag.placedIdx);
  }
  function markTarget(c){
    $('board').querySelectorAll('.floor.target').forEach(t=>t.classList.remove('target','bad'));
    if(!c) return;
    const t=$('board').querySelector(`.floor[data-x="${c.x}"][data-y="${c.y}"]`) || [...$('board').querySelectorAll('.floor')].find(f=>f.style.left===`${P(c.x)}px`&&f.style.top===`${P(c.y)}px`);
    if(t){ t.classList.add('target'); if(!canDrop(c)) t.classList.add('bad'); }
  }
  function moveDrag(e){
    if(!drag) return;
    e.preventDefault();
    if(!drag.moved && Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6) return;
    if(!drag.moved){
      drag.moved=true;
      const g=document.createElement('div'); g.className='ghost';
      g.innerHTML=`<span style="font-size:${Math.round(cell*0.75)}px">${EMOJI[drag.t]}</span>`;
      document.body.appendChild(g); drag.ghost=g;
      if(drag.el) drag.el.classList.add('lifted');
      clearHint();
    }
    drag.ghost.style.left=e.clientX+'px'; drag.ghost.style.top=e.clientY+'px';
    // aim at the square just above the finger, where the ghost is drawn
    drag.target=cellAt(e.clientX, e.clientY-cell*0.5);
    markTarget(drag.target);
  }
  function stopListening(){
    document.removeEventListener('pointermove',moveDrag);
    document.removeEventListener('pointerup',endDrag);
    document.removeEventListener('pointercancel',cancelDrag);
    if(drag&&drag.ghost) drag.ghost.remove();
    markTarget(null);
  }
  function cancelDrag(){ stopListening(); if(drag&&drag.el) drag.el.classList.remove('lifted'); drag=null; }
  function endDrag(){
    const d=drag; stopListening(); drag=null;
    if(!d) return;
    if(!d.moved){ // a tap
      if(d.tray!=null){ selected=d.tray; renderTray(); }
      else if(d.placedIdx!=null){ placed.splice(d.placedIdx,1); renderTray(); renderAnimals(); updateButtons(); }
      return;
    }
    drag=d; const ok=canDrop(d.target); drag=null;
    if(ok){
      if(d.placedIdx!=null){ placed[d.placedIdx]={t:d.t,x:d.target.x,y:d.target.y}; }
      else placed.push({t:d.t,x:d.target.x,y:d.target.y});
      Sound.place();
      selected=0;
    } else if(d.placedIdx!=null && !d.target){ placed.splice(d.placedIdx,1); } // dragged off the board: back to the tray
    renderTray(); renderAnimals(); updateButtons();
  }

  // Hints come as a ladder for each animal you place, in solution order: first the animal on the
  // board it has to scare (or stop), then a 3x3 patch of board it goes somewhere in, and only then
  // the exact square. Revealed hints stay through runs and Reset. The words go in the tip box.
  const PREDATOR = t => ORDER[(ORDER.indexOf(t)+1) % ORDER.length];
  function plan(){
    if (hintPlan) return hintPlan;
    const sol = L.solution, nf = L.fixed.length, full = simulate(L, sol);
    hintPlan = [];
    sol.forEach((s, j) => {
      const aim = firstEffect(full, j);
      if (aim) hintPlan.push({ j, kind:'aim', aim });
      const k = 3, w = Math.min(k, L.w), h = Math.min(k, L.h);
      // the patch doesn't always centre on the square
      const ax = Math.max(0, Math.min(L.w - w, s.x - (s.x*7 + s.y*3 + li) % w));
      const ay = Math.max(0, Math.min(L.h - h, s.y - (s.x*5 + s.y*11 + li) % h));
      hintPlan.push({ j, kind:'area', ax, ay, w, h });
      hintPlan.push({ j, kind:'square' });
    });
    return hintPlan;
  }
  // The first animal whose run changes because piece j is there: run the solution with and without it.
  function firstEffect(full, j){
    const sol = L.solution, s = sol[j], nf = L.fixed.length, pid = nf + j;
    const without = simulate(L, sol.filter((_, k) => k !== j));
    const at = (res, f) => res.frames[Math.min(f, res.frames.length - 1)];
    const len = Math.max(full.frames.length, without.frames.length);
    for (let f = 1; f < len; f++) {
      const a = at(full, f), b = at(without, f), me = at(full, f-1)[pid];
      const diff = a.filter(x => x.id !== pid && (() => { const y = b[x.id < pid ? x.id : x.id - 1]; return y.x !== x.x || y.y !== x.y; })());
      if (!diff.length) continue;
      const near = x => Math.abs(x.x - me.x) + Math.abs(x.y - me.y);
      diff.sort((p, q) => (PREDATOR(q.t) === s.t) - (PREDATOR(p.t) === s.t) || near(p) - near(q));
      const t = diff[0], start = full.frames[0][t.id];
      return { id: t.id, t: t.t, x: start.x, y: start.y, mine: t.id >= nf, scares: PREDATOR(t.t) === s.t };
    }
    return null;
  }
  const shownRungs = () => plan().slice(0, hintStep);
  const revealedSquares = () => shownRungs().filter(r => r.kind === 'square').map(r => L.solution[r.j]);
  function clearHint(){ $('board').querySelectorAll('.hint-ring,.hint-aim,.hint-area').forEach(e=>e.remove()); }
  function drawHints(){
    clearHint();
    if(mode!=='edit') return;
    const rungs = shownRungs(), squared = new Set(rungs.filter(r => r.kind === 'square').map(r => r.j));
    const add = (cls, css, html='') => { const e=document.createElement('div'); e.className=cls; e.style.cssText=css; e.innerHTML=html; $('board').appendChild(e); };
    rungs.forEach(r => {
      if (r.kind === 'square') { const s = L.solution[r.j];
        add('hint-ring', `left:${P(s.x)+cell*.06}px;top:${P(s.y)+cell*.06}px;width:${cell*.88}px;height:${cell*.88}px`, `<b>${EMOJI[s.t]}</b>`); }
      else if (squared.has(r.j)) return;
      else if (r.kind === 'area') add('hint-area', `left:${P(r.ax)}px;top:${P(r.ay)}px;width:${cell*r.w}px;height:${cell*r.h}px`);
      else if (!r.aim.mine) add('hint-aim', `left:${P(r.aim.x)-cell*.04}px;top:${P(r.aim.y)-cell*.04}px;width:${cell*1.08}px;height:${cell*1.08}px`);
    });
  }
  function hintText(r){
    const s = L.solution[r.j], n = NAME[s.t], your = L.solution.length > 1 ? 'your ' : 'the ';
    if (r.kind === 'aim') {
      const verb = r.aim.scares ? 'scare' : 'block';
      return r.aim.mine ? `${your}${n} has to ${verb} your ${NAME[r.aim.t]}.` : `${your}${n} has to ${verb} the circled ${NAME[r.aim.t]}.`;
    }
    if (r.kind === 'area') return `${your}${n} goes somewhere in the shaded squares.`;
    return `put ${your}${n} on the glowing square.`;
  }
  function hint(){
    if(mode==='failed') backToStart();
    if(mode!=='edit') return;
    const sol=L.solution, rungs=plan();
    const onSolution = p => sol.some(q=>q.t===p.t&&q.x===p.x&&q.y===p.y);
    const isPlaced = j => placed.some(p=>p.t===sol[j].t&&p.x===sol[j].x&&p.y===sol[j].y);
    // Skip the hints for animals you've already put in the right place.
    while (hintStep < rungs.length && isPlaced(rungs[hintStep].j)) hintStep++;
    if(hintStep>=rungs.length){ updateButtons(); return; }
    const cost = HINT_COST[rungs[hintStep].kind];
    if (cheese < cost && !DEV) { updateButtons(); toast(`This hint costs ${cost} 🧀. Solve levels without hints to earn more.`); return; }
    if (cheese >= cost) addCheese(-cost);
    const rung=rungs[hintStep++]; hintShown=true;
    hintsUsed[levelKey(L)] = hintStep; store.set('cm_hints', hintsUsed);
    if (rung.kind === 'square') {
      const s=sol[rung.j];
      // A different animal sitting on the hinted square goes back to the tray.
      const here=placed.findIndex(p=>p.x===s.x&&p.y===s.y);
      if(here>=0 && placed[here].t!==s.t) placed.splice(here,1);
      // If every animal of the hinted kind is placed somewhere wrong, send one back so it can be placed.
      if(!placed.some(p=>p.t===s.t&&p.x===s.x&&p.y===s.y) && !remaining().includes(s.t)){
        let k=placed.findIndex(p=>p.t===s.t&&!onSolution(p));
        if(k<0) k=placed.findIndex(p=>p.t===s.t);
        if(k>=0) placed.splice(k,1);
      }
    }
    const t = hintText(rung);
    $('tip').textContent = `💡 ${t[0].toUpperCase()}${t.slice(1)}`; $('tip').classList.add('hinting');
    renderTray(); renderAnimals(); updateButtons();
  }

  // Opens the castle map at the current level's room. After you clear a room (cleared = that room's
  // number) its door swings open, then the map of the next room's area (or the whole castle, when a
  // new area opens) shows the new room appearing.
  function openPicker(cleared){
    $('picker').classList.add('show');
    mouseRoom = roomIndexOf(li);
    const later = (ms, f) => setTimeout(f, ms);
    const openDoor = dw => { dw.classList.remove('to-open'); dw.classList.add('open'); Sound.door();
      for (let k=0;k<8;k++){ const sp=document.createElement('span'); sp.className='spark'; sp.textContent=k%2?'✨':'⭐';
        const a=k/8*Math.PI*2; sp.style.setProperty('--dx',`${Math.cos(a)*46}px`); sp.style.setProperty('--dy',`${Math.sin(a)*34}px`);
        dw.querySelector('.arch').appendChild(sp); setTimeout(()=>sp.remove(),1300); }
      doorsSeen = [...new Set([...doorsSeen, +dw.dataset.r])]; store.set('cm_doors2', doorsSeen); };
    if (cleared !== undefined) {
      view = { kind:'room', r: cleared }; renderDots();
      const dw = $('dots').querySelector(`.doorway[data-r="${cleared}"]`);
      if (dw) { centerOn('.doorway'); later(500, () => openDoor(dw)); }
      later(1900, () => {
        const next = cleared + 1; mouseRoom = next;
        view = room(next).area !== room(cleared).area ? { kind:'castle' } : { kind:'area', a: room(next).area };
        renderDots();
        store.set('cm_map_at', room(next).start);
      });
      return;
    }
    view = { kind:'room', r: mouseRoom }; renderDots();
    const m = $('dots');
    if (!centerOn('.node.cur')) m.scrollTop = 0;
    // The door of a room you've cleared swings open (once).
    const opening = [...m.querySelectorAll('.doorway.to-open')];
    if (opening.length) later(450, () => opening.forEach(openDoor));
    // Your mouse walks the road from the level it last stood on to the current one.
    const from = store.get('cm_map_at', li), walker = m.querySelector('.walker');
    store.set('cm_map_at', li);
    if (walker && from < li && li - from <= 8 && roomIndexOf(from) === roomIndexOf(li)) {
      const at = i => m.querySelector(`.node[data-i="${i}"]`);
      const place = i => { const n=at(i); if (!n) return false; walker.style.left=n.style.left; walker.style.top=n.style.top; return true; };
      walker.style.transition='none'; place(from); walker.offsetWidth; walker.style.transition='';
      let i = from;
      later(opening.length ? 1300 : 450, function step(){
        if (i >= li) { walker.classList.remove('walking'); return; }
        // (stops if you've left the room view meanwhile)
        walker.classList.add('walking'); if (place(++i)) later(280, step);
      });
    }
  }
  const showSound = () => { $('soundBtn').textContent = Sound.on ? '🔊' : '🔇'; $('soundBtn').classList.toggle('off', !Sound.on);
    $('soundBtn').setAttribute('aria-label', Sound.on ? 'Sound on' : 'Sound off'); };
  $('soundBtn').onclick = () => { Sound.toggle(); showSound(); };
  showSound();
  // Phones only allow sound after the first tap, so wake the audio up then.
  document.addEventListener('pointerdown', () => Sound.unlock(), { once: true });
  $('lvlBtn').onclick=()=>{ if(mode!=='running' && mode!=='replay') openPicker(); };
  $('replayBtn').onclick=replay;
  $('replayDone').onclick=endReplay;
  $('playBtn').onclick=rpPlay;
  $('speed1').onclick=()=>{ rp.slow=false; rpShow(); };
  $('speedHalf').onclick=()=>{ rp.slow=true; rpShow(); };
  $('closePick').onclick=()=>$('picker').classList.remove('show');
  $('howTo').onclick=()=>showGuide(INTRO);
  // Developer mode only (hidden for players). Two taps to confirm.
  $('resetProgress').onclick=()=>{
    const b=$('resetProgress');
    if(!b.classList.contains('armed')){ b.classList.add('armed'); b.textContent='Tap again to erase all progress'; clearTimeout(b._t); b._t=setTimeout(()=>{ b.classList.remove('armed'); b.textContent='Reset progress (testing)'; },3000); return; }
    clearTimeout(b._t); b.classList.remove('armed'); b.textContent='Reset progress (testing)';
    solved={}; store.set('cm_solved',solved); hintsUsed={}; store.set('cm_hints',hintsUsed); cheese=5; store.set('cm_cheese',cheese); doorsSeen=[]; store.set('cm_doors2',doorsSeen); store.set('cm_map_at',0); $('picker').classList.remove('show'); load(0); toast('Progress erased.');
  };
  $('picker').onclick=e=>{ if(e.target.id==='picker') $('picker').classList.remove('show'); };
  $('goBtn').onclick=go; $('resetBtn').onclick=reset; $('hintBtn').onclick=hint;
  // After a win: back to the level picker instead of the next level. Reloading the level first
  // puts it back in normal play, showing the winning setup, if the picker is closed without choosing.
  $('winLevelsBtn').onclick=()=>{ $('win').classList.remove('show'); const r=clearedRoom; clearedRoom=undefined; load(li); openPicker(r); };
  $('nextBtn').onclick=()=>{ $('win').classList.remove('show'); load(li===LEVELS.length-1?0:li+1); };
  let rz; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(mode==='edit'){ buildBoard(); renderAnimals(); renderTray(); } },150); });
  // #dev=<passphrase> turns developer mode on for this browser; #dev=off turns it off.
  async function checkDevLink(){
    const m=/^#dev=(.+)$/.exec(location.hash);
    if(!m) return;
    history.replaceState(null,'',location.pathname+location.search); // don't leave the passphrase in the address bar
    const code=decodeURIComponent(m[1]);
    if(code==='off'){ devFlag.set(false); DEV=false; load(Math.min(li,unlockedUpTo())); toast('Developer mode off.'); return; }
    try{
      const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(code));
      const hex=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
      if(hex===DEV_HASH){ devFlag.set(true); DEV=true; renderDots(); toast('Developer mode on: every level is open.'); }
    }catch(e){}
  }

  load(li);
  // First time playing: the how-to-play cards before level 1
  if (!store.get('cm_intro', false) && doneCount() === 0) showGuide(INTRO, () => store.set('cm_intro', true));
  checkDevLink();
  window.addEventListener('hashchange', checkDevLink);
})(); }).catch(e => {
  document.body.innerHTML = '<p style="padding:24px;font-family:system-ui">Sorry, the game failed to load: ' + e.message + '</p>';
});
</script>
</body>
